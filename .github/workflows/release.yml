name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # `musl` rather than `-gnu`: a static binary runs on any Linux, which for a server
          # distributed as an archive is worth more than the last few percent of throughput.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the target
        run: rustup target add ${{ matrix.target }}

      # `aws-lc-sys` is C and assembly. MSVC and CMake are on the image; NASM is not, on any of
      # the three, and without it the failure surfaces much later as a CMake error from inside
      # the dependency rather than as a missing tool.
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm musl-tools
      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"

      # A musl target links statically, and `aws-lc-sys` builds C and assembly of its own, so the
      # musl C compiler has to be the one that is used. `musl-tools` supplies `musl-gcc`; the
      # linker and archiver have to be named or cargo reaches for the glibc ones and fails.
      - name: Configure the musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> $GITHUB_ENV
          echo "AR_x86_64_unknown_linux_musl=ar" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p volucer

      - name: Stage the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bash packaging/stage-archive.sh

      # The claim "this archive runs" is a hypothesis until something runs it. It is extracted
      # somewhere else entirely and invoked, which is the half that catches a missing
      # interpreter, a missing linked library and a binary that is not executable. It also
      # verifies the checksum the Composer downloader will verify.
      - name: Smoke-test the archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: bash packaging/smoke-test-archive.sh

      - name: Attest the provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # The two installers ship beside the archives, and only here: `releases/latest/download/`
      # is only reachable for assets attached to the latest release, so a `curl | sh` in the
      # README is a 404 until these lines exist. Both files live in the repository at
      # `packaging/` and are copied to the release root because that is the path the README
      # documents and the one a person types.
      - name: Stage the installers
        run: |
          cp packaging/install.sh install.sh
          cp packaging/install.ps1 install.ps1
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            volucer-*.tar.gz
            volucer-*.zip
            volucer-*.sha256
            install.sh
            install.ps1
          generate_release_notes: true
          # Still a draft, and the `publish` job below is what opens it. The reason is ordering:
          # `releases/latest/download/` resolves nothing for a draft, so the README's one-liner is
          # a 404 until the assets have been proven - and the proof is the `install` job, which
          # installs from these archives over HTTP and compares the result with the binary this
          # run built. Creating the release public would serve an unverified binary to anyone who
          # typed the one-liner during the window, which is the failure the draft was added for.
          draft: true

  # ci.yml proves the installers against a fixture built by `stage-archive.sh`. This job is the
  # other half: `install.sh` run against the archives *this run* actually built, over HTTP, with
  # nothing substituted but the origin. It is what catches the one failure the fixture cannot -
  # a real archive whose layout, name or checksum file differs from the fixture's - and it is
  # the last point before a stranger's `curl | sh` does the same thing for real.
  install:
    name: Install from the real archives
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # The assets that are on the release are checked, not just the ones in the runner's
      # directory: `softprops/action-gh-release` is told to upload them, and an upload that
      # silently matched nothing still produces a green release.
      - name: Check the release carries the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for want in install.sh install.ps1; do
            printf '%s\n' "$assets" | grep -qx "$want" || {
              echo "::error::the release does not carry ${want}" >&2
              exit 1
            }
          done
          printf '%s\n' "$assets" | grep -q 'x86_64-unknown-linux-gnu.tar.gz$' || {
            echo "::error::no x86_64-unknown-linux-gnu archive on the release" >&2
            exit 1
          }

      # The installer is fetched from the release, not from the checkout. `packaging/install.sh`
      # is already proven by ci.yml; what is unproven until here is the copy that is actually
      # attached to the release - a `cp` into the wrong name, an upload that matched nothing.
      # Testing the checkout would pass while the published one was missing.
      - name: Fetch the published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'install.sh' --dir . --clobber
          test -s install.sh || { echo "::error::the published install.sh is empty" >&2; exit 1; }

      # A release fixture laid out the way the release page lays it out, served over HTTP.
      # `install.sh` refuses `file://` by design (`--proto`), so serving it is the only way to
      # run the shipping code path rather than a relaxation of it.
      - name: Serve the release and install from it
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "${fixture}/releases/download/${GITHUB_REF_NAME}"
          cp volucer-* "${fixture}/releases/download/${GITHUB_REF_NAME}/"

          # download-artifact puts the archives here rather than extracting them, so the
          # expected binary is taken out of the tarball the release shipped.
          expected="$(mktemp -d)"
          tar -xzf "volucer-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-gnu.tar.gz" -C "$expected"

          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$fixture" &
          server=$!
          trap 'kill $server 2>/dev/null || true; rm -rf "$fixture"' EXIT

          # Readiness rather than a sleep: the port is known and a refused connection is the
          # signal. A fixed sleep is the difference between a job that is slow and a job that
          # fails once a month on a loaded runner.
          for _ in $(seq 100); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.5); sys.exit(0 if s.connect_ex(('127.0.0.1',${port})) == 0 else 1)"; then
              break
            fi
            sleep 0.1
          done

          destination="$(mktemp -d)"
          # `VOLUCER_MODIFY_PATH=0` because this installs into a throwaway directory on an
          # ephemeral runner: the PATH edit is the one thing here that would touch a real file
          # for no benefit, and asserting the default from this job would be asserting it
          # against a machine that is about to be destroyed.
          VOLUCER_MODIFY_PATH=0 \
          VOLUCER_VERSION="${GITHUB_REF_NAME}" \
          VOLUCER_INSTALL_DIR="$destination" \
          VOLUCER_DOWNLOAD_URL="http://127.0.0.1:${port}/releases/download" \
          sh install.sh

          # The assertion that matters: the binary the installer placed must be the one this
          # run built, and it must run. A checksum that verified the wrong bytes would pass
          # every check before this one.
          "$destination/volucer" version
          cmp "$destination/volucer" \
            "$expected/volucer-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-gnu/volucer" || {
            echo "::error::the installed binary is not the one this release built" >&2
            exit 1
          }
          echo "the release's own install.sh installs the release's own binary"

  # The last step, and the only one that changes what the outside world can see. It waits for
  # `install` rather than for `release`, because publishing is the moment the one-liner in the
  # README stops being a 404 - it should not start working before the assets behind it have been
  # installed and compared. `docker` runs in parallel with this and depends on `build`, not on it:
  # the images are built and discarded, so nothing they do can be invalidated by publishing.
  publish:
    name: Publish the release
    needs: [release, install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One script rather than a `gh api` call inline, so the steps that matter - that the release
      # really stopped being a draft, and that its installers really download without a token -
      # can be run against a real release. They were, against `v0.1.0`, including each assertion
      # inverted to prove it fails.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish-release.sh

  docker:
    name: Docker (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [glibc, musl]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built and discarded rather than published. This repository has never pushed to a registry,
      # and a workflow that starts pushing on its first run is not one to find that out with —
      # adding `push: true` and a login is the only change needed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ matrix.image }}
          push: false
          load: true
          tags: volucer:${{ matrix.image }}

      # The image is a hypothesis until the binary inside it runs. This is also the only step that
      # would catch a `scratch` image missing its trust store, which is the one thing a static
      # binary cannot be told about at build time.
      - name: Smoke-test the image
        run: docker run --rm volucer:${{ matrix.image }} version
