name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # `musl` rather than `-gnu`: a static binary runs on any Linux, which for a server
          # distributed as an archive is worth more than the last few percent of throughput.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the target
        run: rustup target add ${{ matrix.target }}

      # `aws-lc-sys` is C and assembly. MSVC and CMake are on the image; NASM is not, on any of
      # the three, and without it the failure surfaces much later as a CMake error from inside
      # the dependency rather than as a missing tool.
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm musl-tools
      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"

      # A musl target links statically, and `aws-lc-sys` builds C and assembly of its own, so the
      # musl C compiler has to be the one that is used. `musl-tools` supplies `musl-gcc`; the
      # linker and archiver have to be named or cargo reaches for the glibc ones and fails.
      - name: Configure the musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> $GITHUB_ENV
          echo "AR_x86_64_unknown_linux_musl=ar" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p volucer

      - name: Stage the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bash packaging/stage-archive.sh

      # The claim "this archive runs" is a hypothesis until something runs it. It is extracted
      # somewhere else entirely and invoked, which is the half that catches a missing
      # interpreter, a missing linked library and a binary that is not executable. It also
      # verifies the checksum the Composer downloader will verify.
      - name: Smoke-test the archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: bash packaging/smoke-test-archive.sh

      - name: Attest the provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # The two installers ship beside the archives, and only here: `releases/latest/download/`
      # is only reachable for assets attached to the latest release, so a `curl | sh` in the
      # README is a 404 until these lines exist. Both files live in the repository at
      # `packaging/` and are copied to the release root because that is the path the README
      # documents and the one a person types.
      - name: Stage the installers
        run: |
          cp packaging/install.sh install.sh
          cp packaging/install.ps1 install.ps1
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            volucer-*.tar.gz
            volucer-*.zip
            volucer-*.sha256
            install.sh
            install.ps1
          generate_release_notes: true
          # Still a draft, and the `publish` job below is what opens it. The reason is ordering:
          # `releases/latest/download/` resolves nothing for a draft, so the README's one-liner is
          # a 404 until the assets have been proven - and the proof is the `install` job, which
          # installs from these archives over HTTP and compares the result with the binary this
          # run built. Creating the release public would serve an unverified binary to anyone who
          # typed the one-liner during the window, which is the failure the draft was added for.
          draft: true

  # ci.yml proves the installers against a fixture built by `stage-archive.sh`. This job is the
  # other half: `install.sh` run against the archives *this run* actually built, over HTTP, with
  # nothing substituted but the origin. It is what catches the one failure the fixture cannot -
  # a real archive whose layout, name or checksum file differs from the fixture's - and it is
  # the last point before a stranger's `curl | sh` does the same thing for real.
  install:
    name: Install from the real archives
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # The assets that are on the release are checked, not just the ones in the runner's
      # directory: `softprops/action-gh-release` is told to upload them, and an upload that
      # silently matched nothing still produces a green release.
      - name: Check the release carries the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for want in install.sh install.ps1; do
            printf '%s\n' "$assets" | grep -qx "$want" || {
              echo "::error::the release does not carry ${want}" >&2
              exit 1
            }
          done
          printf '%s\n' "$assets" | grep -q 'x86_64-unknown-linux-gnu.tar.gz$' || {
            echo "::error::no x86_64-unknown-linux-gnu archive on the release" >&2
            exit 1
          }

      # The installer is fetched from the release, not from the checkout. `packaging/install.sh`
      # is already proven by ci.yml; what is unproven until here is the copy that is actually
      # attached to the release - a `cp` into the wrong name, an upload that matched nothing.
      # Testing the checkout would pass while the published one was missing.
      - name: Fetch the published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'install.sh' --dir . --clobber
          test -s install.sh || { echo "::error::the published install.sh is empty" >&2; exit 1; }

      # A release fixture laid out the way the release page lays it out, served over HTTP.
      # `install.sh` refuses `file://` by design (`--proto`), so serving it is the only way to
      # run the shipping code path rather than a relaxation of it.
      - name: Serve the release and install from it
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "${fixture}/releases/download/${GITHUB_REF_NAME}"
          cp volucer-* "${fixture}/releases/download/${GITHUB_REF_NAME}/"

          # download-artifact puts the archives here rather than extracting them, so the
          # expected binary is taken out of the tarball the release shipped.
          expected="$(mktemp -d)"
          tar -xzf "volucer-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-gnu.tar.gz" -C "$expected"

          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$fixture" &
          server=$!
          trap 'kill $server 2>/dev/null || true; rm -rf "$fixture"' EXIT

          # Readiness rather than a sleep: the port is known and a refused connection is the
          # signal. A fixed sleep is the difference between a job that is slow and a job that
          # fails once a month on a loaded runner.
          for _ in $(seq 100); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.5); sys.exit(0 if s.connect_ex(('127.0.0.1',${port})) == 0 else 1)"; then
              break
            fi
            sleep 0.1
          done

          destination="$(mktemp -d)"
          # `VOLUCER_MODIFY_PATH=0` because this installs into a throwaway directory on an
          # ephemeral runner: the PATH edit is the one thing here that would touch a real file
          # for no benefit, and asserting the default from this job would be asserting it
          # against a machine that is about to be destroyed.
          VOLUCER_MODIFY_PATH=0 \
          VOLUCER_VERSION="${GITHUB_REF_NAME}" \
          VOLUCER_INSTALL_DIR="$destination" \
          VOLUCER_DOWNLOAD_URL="http://127.0.0.1:${port}/releases/download" \
          sh install.sh

          # The assertion that matters: the binary the installer placed must be the one this
          # run built, and it must run. A checksum that verified the wrong bytes would pass
          # every check before this one.
          "$destination/volucer" version
          cmp "$destination/volucer" \
            "$expected/volucer-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-gnu/volucer" || {
            echo "::error::the installed binary is not the one this release built" >&2
            exit 1
          }
          echo "the release's own install.sh installs the release's own binary"

  # The last step, and the only one that changes what the outside world can see. It waits for
  # `install` rather than for `release`, because publishing is the moment the one-liner in the
  # README stops being a 404 - it should not start working before the assets behind it have been
  # installed and compared. The two Docker jobs sit on either side of this: `docker` builds and
  # tests each architecture in parallel with this one, and `docker-publish` waits for this job, so
  # an image is not pullable by a tag until the release it belongs to is public.
  publish:
    name: Publish the release
    needs: [release, install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One script rather than a `gh api` call inline, so the steps that matter - that the release
      # really stopped being a draft, and that its installers really download without a token -
      # can be run against a real release. They were, against `v0.1.0`, including each assertion
      # inverted to prove it fails.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish-release.sh

  # Each architecture is built, smoke-tested and then *pushed by digest* — the `sha256:` value, not
  # a tag. Nothing pullable references an image at this point, which is the property that matters:
  # an architecture whose sibling fails leaves no half-published multi-arch tag behind. The
  # `docker-publish` job below assembles the digests into the tags people actually pull.
  docker:
    name: Docker (${{ matrix.image }}, ${{ matrix.platform }})
    needs: build
    # A real arm64 runner rather than QEMU on an amd64 one. The difference is not speed, it is that
    # the smoke test below then executes the arm64 image natively instead of trusting an emulator
    # to behave like the machine the image is for.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [glibc, musl]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7

      # The image name is derived here rather than in a workflow-level `env`, because a registry
      # path has to be lowercase and `github.repository` is not: an owner with a capital letter
      # produces `ghcr.io/Owner/Repo`, which ghcr rejects at push time with a 403 that reads like a
      # permission problem. `tr` is what makes a fork under such an owner work.
      - name: Resolve the image name
        run: |
          set -eu
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE=%s\n' "$image" >>"${GITHUB_ENV}"
          printf 'image: %s\n' "$image"

      - uses: docker/setup-buildx-action@v4

      # `GITHUB_TOKEN` rather than a personal access token or a Docker Hub secret: the package
      # belongs to this repository, so there is nothing for an operator to paste into settings.
      # `packages: write` above is the whole of the authorisation, and it is scoped to this job.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          # `org.opencontainers.image.source` is not decoration: it is what links the package to this
          # repository in GitHub's package settings, and a linked package inherits the repository's
          # access rules. Without it, the first push creates an *unlinked* package that nobody but
          # the account that pushed it can manage.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          # No `tags:` on purpose. A tag here would be pullable before its sibling architecture had
          # even been built; a digest is addressable and not yet referenced by anything.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The digest is a file rather than a step output because `docker` writes one artifact per
      # matrix cell and `docker-publish` reads them all. An upload with no files is an error, so a
      # build that produced nothing fails here instead of as an empty manifest list later.
      - name: Export the digest
        run: |
          set -eu
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::the build produced no digest (got '$digest')" >&2; exit 1 ;;
          esac
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # The image is a hypothesis until the binary inside it runs, and the `HEALTHCHECK` is the one
      # part `version` cannot exercise: it needs a server that is actually serving, and a `scratch`
      # image is exactly where a `HEALTHCHECK CMD curl` would fail invisibly. Both live in
      # `packaging/docker/smoke-test.sh` rather than inline, so `ci.yml` can run the same script
      # before a tag exists — the reason `packaging/release-selftest.sh` exists for the archives.
      #
      # The digest, not a tag: what is tested is byte-for-byte what will be published rather than a
      # local rebuild of it.
      - name: Smoke-test the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash packaging/docker/smoke-test.sh "${IMAGE}@${DIGEST}"

  # The tags are created here and nowhere else, and only after every architecture of every image
  # has been built, pushed and smoke-tested. A manifest list that names a digest nobody pushed, or
  # a tag that appears while half its architectures are still compiling, is the failure this job
  # exists to make impossible: until the `create manifest list` step runs, a pull of `latest`
  # resolves to the previous release.
  #
  # `needs: [docker, publish]` and not just `docker`: publishing an image is a claim that the
  # release is installable, and `publish` is what makes the archives and installers visible. Making
  # the two happen together means nobody finds a tag for a release that failed its install test.
  docker-publish:
    name: Docker (publish)
    needs: [docker, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # `musl` first so the recommended image's tags exist before `glibc`'s. The two do not race -
      # they carry different tags - but a failure in one should not read as "nothing was published".
      matrix:
        image: [musl, glibc]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      # The same derivation as the build job, and it has to be independent: this job downloads
      # artifacts rather than checking out, so an `IMAGE` written to `GITHUB_ENV` by the build job
      # is not visible here. A registry path has to be lowercase and `github.repository` is not.
      - name: Resolve the image name
        run: |
          set -eu
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE=%s\n' "$image" >>"${GITHUB_ENV}"
          printf 'image: %s\n' "$image"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `musl` is the recommended image — a `scratch` base, no libc, smaller — so it takes the
      # unsuffixed tags and `glibc` is the one that carries a suffix. The other way round would make
      # the default choice the one an operator has to know to avoid.
      #
      # The tags are derived here rather than by `docker/metadata-action`. That action would produce
      # the same three names, but it does so through `flavor.suffix` plus `onlatest`, and a wrong
      # `onlatest` publishes a suffixed `latest` beside an unsuffixed one that aliases the image
      # nobody meant as the default — a mistake that is invisible until someone pulls `latest`.
      # The rule is three lines, so it is spelled out:
      #
      #   v1.2.3  ->  1.2.3        1.2        latest
      #   glibc   ->  1.2.3-glibc  1.2-glibc  latest-glibc
      #
      # A pre-release tag such as `v0.3.0-rc.1` deliberately does not move `latest`: `latest` is what
      # a bare `docker pull` installs, and a release candidate is not that.
      - name: Compute the tags
        env:
          SUFFIX: ${{ matrix.image == 'glibc' && '-glibc' || '' }}
        run: |
          set -eu
          # `GITHUB_REF_NAME` is the tag that triggered this workflow, and this workflow only runs
          # on `v*`. Dropping the `v` is what makes the image tag match every other release
          # artifact, which the changelog and the docs quote without one.
          version="${GITHUB_REF_NAME#v}"
          core="${version%%[-+]*}"
          # Exactly three numeric fields. Anything else - `v0.2`, a branch name, a hand-made tag -
          # is a refusal rather than a tag nobody meant to publish.
          old_ifs="${IFS}"
          IFS=.
          # shellcheck disable=SC2086
          set -- ${core}
          IFS="${old_ifs}"
          [ "$#" -eq 3 ] || {
            echo "::error::'${GITHUB_REF_NAME}' is not a version tag" >&2
            exit 1
          }
          for field in "$@"; do
            case "${field}" in
              '' | *[!0-9]*)
                echo "::error::'${GITHUB_REF_NAME}' is not a version tag" >&2
                exit 1
                ;;
            esac
          done
          # Anything after the three fields is a pre-release (`-rc.1`) or build metadata (`+abc`).
          # Neither changes which release this is: the tag is cut from `core`, and only `latest`
          # treats the two differently. A trailing `-` with nothing after it is not a tag either.
          case "$version" in
            *[-+] | *[-+][-+]*) echo "::error::'${GITHUB_REF_NAME}' is not a version tag" >&2; exit 1 ;;
          esac
          tags="${RUNNER_TEMP}/tags.txt"
          printf '%s\n' "${IMAGE}:${core}${SUFFIX}" >"$tags"
          printf '%s\n' "${IMAGE}:${core%.*}${SUFFIX}" >>"$tags"
          case "$version" in
            *-*) ;;
            *) printf '%s\n' "${IMAGE}:latest${SUFFIX}" >>"$tags" ;;
          esac
          cat "$tags"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          # `-t` per tag and one digest per architecture is the whole of what a manifest list is.
          # `name-canonical=true` above is what makes each digest fully qualified: a bare
          # `sha256:...` is registry-ambiguous, and `imagetools` would look for it on Docker Hub.
          args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args="${args} -t ${tag}"
          done <"${{ runner.temp }}/tags.txt"
          # The artifacts are files named for their hex, one per architecture, so a glob is the
          # whole set. It is a glob rather than a count so that a third architecture later needs no
          # change here - the check below is what enforces the two that exist today.
          found=0
          for file in *; do
            [ -f "$file" ] || continue
            found=$((found + 1))
            args="${args} ${IMAGE}@sha256:${file}"
          done
          [ "$found" -gt 0 ] || { echo "::error::no digests to assemble" >&2; exit 1; }
          # Word splitting is the point: one `-t`/image pair per argument.
          # shellcheck disable=SC2086
          docker buildx imagetools create ${args}

      # A tag that resolves to one architecture, or to nothing, is the failure this asserts against
      # - `imagetools create` is happy to build a list from a single digest. `inspect --raw` fetches
      # the list from the registry rather than reading a local cache, so this is the registry's
      # answer to "what did we just publish", not this runner's belief about it.
      - name: Verify the published manifest list
        run: |
          set -eu
          count="$(ls -1 "${{ runner.temp }}/digests" | wc -l | tr -d ' ')"
          [ "$count" -eq 2 ] || {
            echo "::error::expected a digest for each of linux/amd64 and linux/arm64, got ${count}" >&2
            exit 1
          }
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            # `|| true` so a manifest the registry returns in an unexpected shape reaches the
            # assertions below as "no platforms found" rather than as a bare `grep` failure, which
            # would report `grep: no match` and nothing about the tag.
            platforms="$(docker buildx imagetools inspect --raw "$tag" \
              | tr -d ' \n' | grep -o '"architecture":"[a-z0-9]*"' | sort -u | tr '\n' ' ' || true)"
            printf '%s -> %s\n' "$tag" "$platforms"
            case "$platforms" in
              *amd64*) ;;
              *) echo "::error::${tag} has no linux/amd64 image" >&2; exit 1 ;;
            esac
            case "$platforms" in
              *arm64*) ;;
              *) echo "::error::${tag} has no linux/arm64 image" >&2; exit 1 ;;
            esac
          done <"${{ runner.temp }}/tags.txt"
