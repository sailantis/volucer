name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run's answer irrelevant, and a full matrix is
# three platforms times a C toolchain. Cancel rather than queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      # `volucer.example.toml` is written in TOML 1.1, which is what the server parses — so an
      # inline table there may span lines and end with a comma. Taplo, the engine behind most
      # editors' TOML support, implements 1.0 and reports exactly that as three errors, so it
      # cannot be the checker. Tombi is maintained, tests against `toml-test`, and takes the
      # version from the `tombi.toml` beside this workflow's working directory.
      #
      # Lint only, not `format --check`: that file is a commentary document whose block ordering
      # is the reading order, and a formatter that regrouped it would be a diff on every edit.
      - uses: tombi-toml/setup-tombi@v1.9.6
      - run: tombi lint --quiet .
      # Em dashes and similar punctuation are written in this repository's prose, and a tool that
      # round-trips a UTF-8 file through a single-byte encoding turns every one of them into three
      # visible characters. `cargo fmt` does not read comments, so it cannot catch that, and 106 of
      # them were committed across five files before anyone noticed.
      #
      # The pattern is the UTF-8 encoding of the two characters that damage produces, matched as
      # fixed bytes rather than as a regex so no locale can reinterpret it.
      - name: No double-encoded UTF-8
        run: |
          if grep -rIl --exclude-dir=target --exclude-dir=.git -F $'\xc3\xa2\xe2\x82\xac' .; then
            echo "::error::the files above contain mojibake — a UTF-8 file was written as CP-1252 and read back as UTF-8"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # NASM is not on the runner image and `aws-lc-sys` needs it to assemble its crypto code,
      # so this is a build prerequisite rather than a linting detail. See the README's
      # "Build prerequisites".
      - run: sudo apt-get update && sudo apt-get install -y nasm
      # **Three passes, and the second and third are the load-bearing ones.** The default build is
      # what a deployment gets, so it must lint clean; `--features http3` and `--features amqp` are
      # the halves that are otherwise never compiled by CI at all, and a feature nothing builds is
      # a feature that rots. Named rather than `--all-features`, because `redis` needs a server the
      # job does not have and the point here is the optional features specifically.
      #
      # `amqp` landed after this job was written, which is exactly the gap this list exists to
      # close: no broker is needed to *lint* the driver — the client is compiled and never
      # connected — so the cost is a third compile, not a service.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features http3 -- -D warnings
      - run: cargo clippy --workspace --all-targets --features amqp -- -D warnings

  # `rust-version` is a promise about what a clean machine needs, and an unverified promise is how
  # this one came to be wrong: the manifest said 1.85 while a transitive dependency required 1.88.
  # The number below is the workspace's `rust-version`, written out because an action cannot
  # interpolate a manifest.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: cargo +1.88.0 check --workspace --all-targets
      # The HTTP/3 dependencies have their own floors — `quinn` 0.11 needs 1.85 — and a feature
      # whose MSRV is unverified is the same broken promise one level down.
      - run: cargo +1.88.0 check --workspace --all-targets --features http3

  # Advisories, licences and sources. **This job exists because of the HTTP/3 work and would have
  # caught its central risk**: `h3` 0.0.8 carries an unpatched amplification advisory
  # (hyperium/h3#379), and nothing in this repository was reading the advisory database. It also
  # turned up three unrelated pre-existing vulnerabilities in the graph, which were fixed by patch
  # upgrade rather than suppressed.
  #
  # Runs against `--all-features` so the HTTP/3 dependencies are in scope at all: the default graph
  # does not contain `h3`, `quinn` or `h3-quinn`, so a check on it would report on a subset of what a
  # release actually ships.
  deny:
    name: Deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          # `--locked` in spirit: the action reads `Cargo.lock` from the checkout, and the lockfile
          # is committed, so what is checked is what ships.

  test:
    name: Test (${{ matrix.os }})
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # `aws-lc-sys` is C and assembly, so every platform needs a C toolchain, NASM and CMake.
      # MSVC and CMake are on the image; NASM is not, on any of the three.
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      # The `addresses` site-binding tests reach a second loopback destination, which is how they
      # prove the rule uses the address a connection arrived on. Linux and Windows route all of
      # 127.0.0.0/8 to `lo0`; macOS puts only 127.0.0.1 there, so 127.0.0.2 is unroutable and the
      # connection times out rather than being refused. The alias is what makes that address a
      # destination, and adding it here keeps the test real rather than skipped.
      - name: Add a second loopback address (macOS)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"

      # PHP is what makes the FastCGI and worker suites mean anything: without it they skip, and
      # a skip is invisible in a passing run. See the two steps below.
      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.3'
          tools: none
          coverage: none

      # The suites that drive a real `php-cgi` and a real `example/worker.php` need the SDK
      # checkout, which is a separate repository, so it is a separate step.
      - name: Check out the PHP worker SDK
        uses: actions/checkout@v7
        with:
          repository: sailantis/volucer-php-sdk
          path: volucer-php-sdk

      # `VOLUCER_E2E` makes a skip a failure, which is the only way this job proves the suites
      # that need PHP actually ran. Without it the job reports the same green for a machine with
      # no interpreter at all.
      - name: Test
        env:
          VOLUCER_E2E: '1'
          VOLUCER_SDK_DIR: ${{ github.workspace }}/volucer-php-sdk
        run: cargo test --workspace

      # **The HTTP/3 suite, and it has to be a separate run.** These tests bind real UDP sockets
      # and drive a real QUIC client, so they only exist when the feature is on — and with the
      # default feature set they compile to nothing, which is a `0 passed` that reads as green.
      # Running them here is what makes `http3.rs` a test rather than a file.
      - name: Test (http3)
        env:
          VOLUCER_E2E: '1'
          VOLUCER_SDK_DIR: ${{ github.workspace }}/volucer-php-sdk
        run: cargo test --workspace --features http3

      # `amqp` is deliberately **not** here. Its suite needs a broker, and a GitHub Actions
      # `services:` block needs Docker, which the macOS and Windows runners do not have — a service
      # on this matrix would fail the two jobs it cannot help. It has its own Linux job below.

      # **The suites that are compiled away, not skipped, and therefore need a count.** A
      # `#[cfg(unix)]` test does not exist on Windows and a `#[cfg(target_os = "linux")]` one does
      # not exist on macOS. libtest has nothing to report for a test that was never compiled, so
      # `0 passed` and `2 passed` are both green — the count is the only evidence.
      #
      # A floor rather than an exact number, so adding a test does not require editing this file.
      # Only losing one does, which is the direction that matters.
      - name: Assert the platform-gated tests are compiled in (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p volucer --test serve --no-run
          listed=$(cargo test -p volucer --test serve -- --list --format terse)
          unix=$(echo "$listed" | grep -c '^a_unix_' || true)
          drain=$(echo "$listed" | grep -c '^a_stop_finishes' || true)
          echo "unix-socket tests: $unix, drain tests: $drain"
          if [ "$unix" -lt 2 ] || [ "$drain" -lt 1 ]; then
            echo "::error::expected >=2 a_unix_ tests and >=1 drain test on Linux, found $unix and $drain — a cfg gate has removed one"
            exit 1
          fi

      - name: Assert the unix-socket tests are compiled in (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo test -p volucer --test serve --no-run
          listed=$(cargo test -p volucer --test serve -- --list --format terse)
          unix=$(echo "$listed" | grep -c '^a_unix_' || true)
          echo "unix-socket tests: $unix"
          if [ "$unix" -lt 2 ]; then
            echo "::error::expected >=2 a_unix_ tests on macOS, found $unix"
            exit 1
          fi

  # **The AMQP driver, against a real broker, and it was untested by CI at all.** The RabbitMQ
  # driver landed two days after this workflow was last edited, by which time adding it meant
  # editing CI rather than forgetting to — the `amqp` feature compiled in no job, so a build that
  # could not compile `amqp.rs` would have shipped green.
  #
  # It is a job of its own rather than a matrix step because `services:` needs Docker and only the
  # Linux runners have it. RabbitMQ with a management-free image and a fixed guest account, which is
  # the one every AMQP tutorial uses; the suite creates and deletes its own uniquely named queues,
  # so it is safe to share.
  amqp:
    name: AMQP (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nasm
      # `VOLUCER_E2E=1` is what makes the suite's own skip a failure. Without it, a broker that
      # never came up produces ten green "skipping: no AMQP broker" lines — the same shape of
      # false pass this file already guards against for PHP.
      - name: Test (amqp)
        env:
          VOLUCER_E2E: '1'
          # `%2f` is the AMQP URI spelling of the default `/` virtual host, and it is the spelling
          # the driver had to be fixed to accept. Written this way so the CI proves that spelling.
          AMQP_URL: amqp://guest:guest@127.0.0.1:5672/%2f
        run: cargo test --workspace --features amqp

  # The installers are the first thing an operator runs and the last thing anyone tests, and both
  # of them are shell scripts with a security property: verify before extracting. A `curl | sh`
  # that has never executed is a script that fails on a stranger's machine, in a shell nobody here
  # has. This runs them against a fixture release on every platform, including the negative cases,
  # because an installer that accepts a corrupted archive is worse than no installer at all.
  installers:
    name: Installers (${{ matrix.os }})
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
      # A debug build rather than `--release`: the binary only has to run `version` and `--help`,
      # and compiling the release profile three more times to prove a shell script extracts a
      # tarball is minutes spent on nothing this job is about.
      - name: Build
        run: cargo build -p volucer
      - name: Run the installer checks
        shell: bash
        env:
          BIN: target/debug/volucer${{ runner.os == 'Windows' && '.exe' || '' }}
          SELFTEST_ARCHIVE: ${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          # `sh` is `dash` on Ubuntu and `bash` on macOS. The installer claims to be POSIX `sh`,
          # so it is run under dash explicitly on Linux rather than under whichever shell the
          # runner happens to link.
          VOLUCER_SH: ${{ runner.os == 'Linux' && 'dash' || 'sh' }}
        run: bash packaging/install-selftest.sh "$BIN"

  # `release.yml` is the one workflow whose logic cannot be exercised by pushing a branch: the
  # staging, smoke-test and publish steps only run on a `v*` tag, so without this job the first
  # execution of any of them is release day. `release-selftest.sh` runs the first two for real
  # against a binary built here. The third is a `gh api` call against a release that does not
  # exist yet, so what is checked here is the half that does not need one: the argument and
  # environment handling, which is what silently misbehaves in a workflow - an unset
  # `GITHUB_REF_NAME` reaching `gh` as an empty tag.
  release-scripts:
    name: Release scripts
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nasm
      # Debug, like the installer job: the binary only has to run `version`, and a release build
      # here would be minutes spent proving that `tar` packs a file.
      - name: Build
        run: cargo build -p volucer
      - name: Stage, pack, smoke-test and refuse a corrupted archive
        shell: bash
        run: bash packaging/release-selftest.sh target/debug/volucer
      # A script that publishes a release is one to be careful with, and the careful thing is that
      # it refuses to run rather than guessing which release was meant. Both of these exit non-zero
      # before any `gh` call, which is the property being asserted - not the wording.
      - name: The publish script refuses an unidentifiable release
        shell: bash
        run: |
          set -euo pipefail
          if bash packaging/publish-release.sh; then
            echo "::error::publish-release.sh ran with no tag at all" >&2
            exit 1
          fi
          if GITHUB_REF_NAME=v0.0.0 GITHUB_REPOSITORY=sailantis/volucer \
             GH_TOKEN="${{ github.token }}" bash packaging/publish-release.sh; then
            echo "::error::publish-release.sh ran for a tag that has no release" >&2
            exit 1
          fi

  # `release.yml`'s Docker jobs build, push and smoke-test images on a `v*` tag, so without this job
  # the first execution of any of that is release day. Two things are checked here that only a
  # build can answer: that the Dockerfile still builds on both architectures, and that the
  # `HEALTHCHECK` inside it still answers both ways. The tags are not published - a pull request
  # from a fork has no `packages: write` and should not need one.
  #
  # amd64 only. The arm64 image is proven on the `docker` job's native arm64 runner at release time,
  # where `ubuntu-24.04-arm` is free; adding QEMU here would emulate a compiler for half an hour to
  # check a line the release build already checks natively.
  docker:
    name: Docker (${{ matrix.image }})
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [glibc, musl]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ matrix.image }}
          load: true
          push: false
          tags: volucer:${{ matrix.image }}
      # The same script `release.yml` runs against a pushed digest. Running the identical code here
      # is the point: an inline copy would drift, and the copy that runs at release time is the one
      # nobody can exercise beforehand.
      - name: Smoke-test the image
        shell: bash
        run: bash packaging/docker/smoke-test.sh volucer:${{ matrix.image }}

  # A published crate cannot depend on a version that is not on crates.io yet, so the publish
  # order is forced and a mistake in it is invisible until release day.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nasm
      # No `--allow-dirty`: a clean tree is part of what publishable means, and tolerating a dirty
      # one here would hide exactly the mistake (an uncommitted fix) that a release most often is.
      - run: cargo package --workspace
