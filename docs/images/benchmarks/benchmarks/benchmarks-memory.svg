" y="60.0" width="12" height="12" rx="3" fill="#c2410c"/><text x="621.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">volucer — spawn_cgi (cold, unix, children)</text><rect x="74.0" y="77.0" width="12" height="12" rx="3" fill="#64748b"/><text x="92.0" y="87.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">nginx + php-fpm — cold, unix socket</text><text x="74.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">Proportional set size of the whole process tree, after the run: each shared page is divided by the number of processes that map it, so</text><text x="74.0" y="149.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">a page the children share counts once. 12 cores, 7910 MB · Linux 6.8.0-139-generic · PHP 8.5.11 (cli) · volucer c3da7ff · 8 arms ·</text><text x="74.0" y="164.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">c=8,16,32,64, 5s per cell, 3 repeats</text><line x1="74" y1="346.0" x2="944" y2="346.0" stroke="#f1f5f9" stroke-width="1"/><text x="66.0" y="350.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">0</text><line x1="74" y1="304.5" x2="944" y2="304.5" stroke="#f1f5f9" stroke-width="1"/><text x="66.0" y="308.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="en