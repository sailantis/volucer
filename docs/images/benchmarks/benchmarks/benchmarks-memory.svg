<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-label="Proportional memory against the number of PHP processes"><rect x="0.5" y="0.5" width="959" height="485" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="64.0" y="38.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#1e293b" text-anchor="start" font-weight="600">Proportional memory against the number of PHP processes</text><rect x="84.0" y="45.0" width="14" height="14" rx="3" fill="#7c3aed"/><text x="106.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">volucer — attach (warm, unix relay)</text><rect x="390.6" y="45.0" width="14" height="14" rx="3" fill="#2563eb"/><text x="412.6" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">volucer — worker (warm, pipe)</text><rect x="84.0" y="67.0" width="14" height="14" rx="3" fill="#38bdf8"/><text x="106.0" y="82.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">volucer — worker (warm, unix socket)</text><rect x="398.2" y="67.0" width="14" height="14" rx="3" fill="#0d9488"/><text x="420.2" y="82.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">RoadRunner — worker (warm, pipe)</text><rect x="84.0" y="89.0" width="14" height="14" rx="3" fill="#a855f7"/><text x="106.0" y="104.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">FrankenPHP — worker (warm, embedded)</text><rect x="398.2" y="89.0" width="14" height="14" rx="3" fill="#c2410c"/><text x="420.2" y="104.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">volucer — spawn_cgi (cold, unix, children)</text><rect x="84.0" y="111.0" width="14" height="14" rx="3" fill="#64748b"/><text x="106.0" y="126.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">nginx + php-fpm — cold, unix socket</text><text x="84.0" y="174.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">Proportional set size of the whole process tree, after the run: each shared page is divided by the number of processes</text><text x="84.0" y="194.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">that map it, so a page the children share counts once.</text><text x="84.0" y="214.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">12 cores, 7910 MB · Linux 6.8.0-139-generic · c=8,16,32,64, 5s per cell, 3 repeats</text><text x="84.0" y="231.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal" font-style="italic">Volucer 0.1.0 (c3da7ff) · RoadRunner 2025.1.15 · FrankenPHP v1.13.0 · nginx 1.24.0 · PHP 8.5.11</text><line x1="84" y1="424.0" x2="944" y2="424.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="428.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6