<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="The same PHP processes, arranged two ways"><rect x="0.5" y="0.5" width="959" height="339" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="64.0" y="34.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1e293b" text-anchor="start" font-weight="600">The same PHP processes, arranged two ways</text><rect x="74.0" y="43.0" width="12" height="12" rx="3" fill="#94a3b8"/><text x="92.0" y="53.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">spawn_cgi — one process per slot</text><rect x="325.0" y="43.0" width="12" height="12" rx="3" fill="#c2410c"/><text x="343.0" y="53.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">spawn_cgi — one slot × N children</text><text x="74.0" y="100.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">Proportional set size of the whole process tree, after the run: each shared page is divided by the number of processes that map it, so</text><text x="74.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">a page the children share counts once. The same number of PHP processes, serving the same requests: once as separate slots, once as the</text><text x="74.0" y="130.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">children of a single slot. 12 cores, 7910 MB · Linux 6.8.0-139-generic · PHP 8.5.11 (cli) · volucer c3da7ff · 8 arms · c=8,16,32,64, 5s</text><text x="74.0" y="145.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="normal">per cell, 3 repeats</text><line x1="74" y1="266.0" x2="944" y2="266.0" stroke="#f1f5f9" stroke-width="1"/><text x="66.0" y="270.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">0</text><line x1="74" y1="240.5" x2="944" y2="240.5" stroke="#f1f5f9" stroke-width="1"/><text x="66.0" y="244.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">300</text><line x1="74" y1="215.0" x2="944" y2="215.0" stroke="#f1f5f9" stroke-width="1"/><text x="66.0" y="219.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">600</text><line x1="74" y1="189.5" x2="944" y2="189.5" stroke="#f1f5f9" stroke-width="1"/><text x="66.0" y="193.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">900</text><line x1="74" y1="164.0" x2="944" y2="164.0" stroke="#f1f5f9" stroke-width="1"/><text x="66.0" y="168.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">1200</text><line x1="74" y1="266" x2="944" y2="266" stroke="#cbd5e1" stroke-width="1"/><rect x="105.9" y="239.7" width="109.1" height="26.3" rx="2" fill="#94a3b8"/><rect x="219.0" y="260.2" width="109.1" height="5.8" rx="2" fill="#c2410c"/><text x="219.0" y="286.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal">16 processes</text><rect x="395.9" y="217.2" width="109.1" height="48.8" rx="2" fill="#94a3b8"/><rect x="509.0" y="258.5" width="109.1" height="7.5" rx="2" fill="#c2410c"/><text x="509.0" y="286.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal">32 processes</text><rect x="685.9" y="172.2" width="109.1" height="93.8" rx="2" fill="#94a3b8"/><rect x="799.0" y="255.8" width="109.1" height="10.2" rx="2" fill="#c2410c"/><text x="799.0" y="286.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal">64 processes</text><text x="944.0" y="34.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">MiB</text></svg>
