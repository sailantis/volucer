<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="The same PHP processes, arranged two ways"><rect x="0.5" y="0.5" width="959" height="439" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="64.0" y="38.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#1e293b" text-anchor="start" font-weight="600">The same PHP processes, arranged two ways</text><rect x="84.0" y="45.0" width="14" height="14" rx="3" fill="#94a3b8"/><text x="106.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">spawn_cgi — one process per slot</text><rect x="367.9" y="45.0" width="14" height="14" rx="3" fill="#c2410c"/><text x="389.9" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">spawn_cgi — one slot × N children</text><text x="84.0" y="108.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">Proportional set size of the whole process tree, after the run: each shared page is divided by the number of processes</text><text x="84.0" y="128.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">that map it, so a page the children share counts once. The same number of PHP processes, serving the same requests:</text><text x="84.0" y="148.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">once as separate slots, once as the children of a single slot.</text><text x="84.0" y="168.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">12 cores, 7910 MB · Linux 6.8.0-139-generic · c=8,16,32,64, 5s per cell, 3 repeats</text><text x="84.0" y="185.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal" font-style="italic">Volucer 0.1.0 (c3da7ff) · PHP 8.5.11</text><line x1="84" y1="378.0" x2="944" y2="378.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="382.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">0</text><line x1="84" y1="338.0" x2="944" y2="338.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="342.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">300</text><line x1="84" y1="298.0" x2="944" y2="298.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="302.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">600</text><line x1="84" y1="258.0" x2="944" y2="258.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="262.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">900</text><line x1="84" y1="218.0" x2="944" y2="218.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="222.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">1200</text><line x1="84" y1="378" x2="944" y2="378" stroke="#cbd5e1" stroke-width="1"/><rect x="98.3" y="336.7" width="124.0" height="41.3" rx="3" fill="#94a3b8"/><rect x="227.3" y="368.8" width="124.0" height="9.2" rx="3" fill="#c2410c"/><text x="227.3" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.0" fill="#1e293b" text-anchor="middle" font-weight="normal">16 processes</text><rect x="385.0" y="301.4" width="124.0" height="76.6" rx="3" fill="#94a3b8"/><rect x="514.0" y="366.1" width="124.0" height="11.9" rx="3" fill="#c2410c"/><text x="514.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.0" fill="#1e293b" text-anchor="middle" font-weight="normal">32 processes</text><rect x="671.7" y="230.9" width="124.0" height="147.1" rx="3" fill="#94a3b8"/><rect x="800.7" y="362.5" width="124.0" height="15.5" rx="3" fill="#c2410c"/><text x="800.7" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.0" fill="#1e293b" text-anchor="middle" font-weight="normal">64 processes</text><text x="944.0" y="38.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">MiB</text></svg>
