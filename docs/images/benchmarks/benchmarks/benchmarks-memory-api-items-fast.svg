rm, embedded), threads</text><rect x="466.2" y="89.0" width="14" height="14" rx="3" fill="#c2410c"/><text x="488.2" y="104.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">volucer — spawn_cgi (cold, unix, children)</text><rect x="84.0" y="111.0" width="14" height="14" rx="3" fill="#64748b"/><text x="106.0" y="126.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">nginx + php-fpm — cold, unix socket</text><text x="84.0" y="174.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">Proportional set size of the whole process tree, after the run: each shared page is divided by the number of processes</text><text x="84.0" y="194.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">that map it, so a page the children share counts once.</text><text x="84.0" y="214.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">12 cores, 7910 MB · Linux 6.8.0-139-generic · c=32,64,96, 10s per cell, 5 repeats</text><text x="84.0" y="231.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal" font-style="italic">Volucer 0.6.0 (132f560) · RoadRunner 3.0.1 · FrankenPHP v1.13.4 · nginx 1.24.0 · PHP 8.5.11</text><line x1="84" y1="424.0" x2="944" y2="424.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="428.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-si