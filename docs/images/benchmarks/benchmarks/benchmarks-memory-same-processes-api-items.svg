<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="The same PHP processes, arranged two ways"><rect x="0.5" y="0.5" width="959" height="439" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="64.0" y="38.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#1e293b" text-anchor="start" font-weight="600">The same PHP processes, arranged two ways</text><rect x="84.0" y="45.0" width="14" height="14" rx="3" fill="#94a3b8"/><text x="106.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">spawn_cgi — one process per slot</text><rect x="367.9" y="45.0" width="14" height="14" rx="3" fill="#c2410c"/><text x="389.9" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b" text-anchor="start" font-weight="normal">spawn_cgi — one slot × N children</text><text x="84.0" y="108.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">Proportional set size of the whole process tree, after the run: each shared page is divided by the number of processes</text><text x="84.0" y="128.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">that map it, so a page the children share counts once. The same number of PHP processes, serving the same requests:</text><text x="84.0" y="148.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" fill="#64748b" text-anchor="start" font-weight="normal">once as separate slots, once as the children of a single slot.</text><text x="84.0" y="168.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal">12 cores, 7910 MB · Linux 6.8.0-139-generic · c=32,64,96, 10s per cell, 5 repeats</text><text x="84.0" y="185.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal" font-style="italic">Volucer 0.6.0 (132f560) · PHP 8.5.11</text><line x1="84" y1="378.0" x2="944" y2="378.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="382.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">0</text><line x1="84" y1="338.0" x2="944" y2="338.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="342.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">200</text><line x1="84" y1="298.0" x2="944" y2="298.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="302.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">400</text><line x1="84" y1="258.0" x2="944" y2="258.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="262.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">600</text><line x1="84" y1="218.0" x2="944" y2="218.0" stroke="#f1f5f9" stroke-width="1"/><text x="74.0" y="222.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">800</text><line x1="84" y1="378" x2="944" y2="378" stroke="#cbd5e1" stroke-width="1"/><rect x="105.5" y="309.9" width="188.5" height="68.1" rx="3" fill="#94a3b8"/><rect x="299.0" y="363.3" width="188.5" height="14.7" rx="3" fill="#c2410c"/><text x="299.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.0" fill="#1e293b" text-anchor="middle" font-weight="normal">16 processes</text><rect x="535.5" y="251.3" width="188.5" height="126.7" rx="3" fill="#94a3b8"/><rect x="729.0" y="359.4" width="188.5" height="18.6" rx="3" fill="#c2410c"/><text x="729.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.0" fill="#1e293b" text-anchor="middle" font-weight="normal">32 processes</text><text x="944.0" y="38.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="normal">MiB</text></svg>
