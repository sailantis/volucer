[package]
name = "volucer-core"
description = "Configuration, backend model and PHP discovery for volucer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[features]
default = []
# Enables the `redis` KV driver *in the configuration model*: a build without it refuses
# `driver = "redis"` at parse time, which is the honest answer, rather than accepting a table whose store
# cannot be built. The feature carries no dependency of its own — the driver itself lives in
# `volucer-kv` — so this only widens the enum.
redis = []
# Enables `driver = "amqp"` *in the configuration model*, on the same rule as `redis`: a build without
# the driver refuses the table at parse time by naming the driver, rather than accepting a pipeline whose
# queue cannot be built. Like `redis`, this feature carries no dependency — the client lives in
# `volucer-jobs` — so it only widens the enum.
amqp = []
# Enables `[server.http3]` *in the configuration model*, on the same rule: a build without the
# listener refuses the table by name instead of accepting a block nothing will bind. The table's
# fields are declared either way, so a `volucer.toml` written for a release build still parses
# under a build without the feature and is refused with a sentence rather than an unknown field.
http3 = []
