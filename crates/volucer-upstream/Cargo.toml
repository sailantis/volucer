[package]
name = "volucer-upstream"
description = "The HTTP backend for volucer: a pooled client that proxies a request to an origin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
volucer-core.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower-service.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# For a test origin's certificate: a real root, a leaf signed by it, and the same leaf
# presented by an origin whose chain the client has *not* been told to trust. A verification
# test needs a certificate that fails for the right reason, and a hand-written DER blob would
# be a fixture nobody can reread.
rcgen = "0.13"
rustls = { version = "0.23", features = ["custom-provider"] }
tokio-rustls = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# `tests/host_on_the_wire.rs` asserts what an h2 origin is told the request is for, and on an h2
# hop that identity is the `:authority` pseudo-header — inside an HPACK-compressed block, whose
# frame layout differs between RFC 7540 and RFC 9113. Decoding it with `h2`, the implementation
# hyper already uses, rather than with a hand-written decoder: that decoder is what this test
# first got wrong, and re-deriving a spec is not what the test is for.
h2 = "0.4"
