[package]
name = "volucer-server"
description = "Backend supervision and dispatch for volucer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
volucer-core.workspace = true
volucer-fcgi.workspace = true
volucer-worker.workspace = true
volucer-watch.workspace = true
# The request id, the trace context and the access log. Here rather than only in the HTTP
# front-end because **both** front-ends must assign the same id and write the same log — a
# deployment behind nginx runs both, and one of them logging differently is the defect the
# shared reload state exists to prevent, one layer up.
volucer-observe.workspace = true
# The metric registry the worker pools and the front-ends publish into, and the `rr_http_*` names.
# A leaf crate; see its manifest for why the exposition encoder is written by hand.
volucer-metrics.workspace = true
# The store trait and the in-memory driver, for the `kv` namespace. A leaf crate with one dependency,
# so a deployment using only the memory driver does not link a Redis to serve it — which is the whole
# argument of features being grouped per driver.
volucer-kv.workspace = true
# The lock trait and the in-memory driver, for the `lock` namespace. A leaf crate like the one above and
# for the same reason, plus one of its own: a lock is named by its *resource*, so there is one lock
# backend and `services = ["lock"]` is the whole name.
volucer-lock.workspace = true
# The queue trait and the in-memory driver, for the `jobs` namespace. A leaf crate like the other two:
# the producer side of a queue is a registry entry, and the consumer side is the pool's own exchange.
volucer-jobs.workspace = true
# The fourth backend kind. This crate already held hyper's *server* types indirectly through
# `volucer-http`, but the client is what a pooled origin connection needs, and a backend is the
# thing that owns a connection pool — so it belongs here rather than in the listener, which only
# has to know how to *call* this.
volucer-upstream.workspace = true
getrandom.workspace = true
bytes.workspace = true
# `TokioIo` adapts a `tokio` IO to `hyper`'s `Read`/`Write`, which is what a request body needs to
# cross between the listener's runtime and this crate's client.
hyper.workspace = true
hyper-util.workspace = true
# The whole `tokio` runtime — not just `hyper`'s dependency on it — because an `attach` slot
# drives a unix socket directly: `net` for the socket, `time` for the request deadline,
# `rt-multi-thread` for the `Handle` that a synchronous caller bridges through, and `sync` for the
# mutex the connection is behind. See `worker_pool::wire` for why the alternative — a thread per
# worker parking on a blocking read — costs ~13 µs of CPU per request.
tokio = { workspace = true, features = ["net"] }
# Serializes the request frame's head. The server builds that head by borrowing it out of
# the CGI environment, so it implements `Serialize` for its own borrowed header type rather
# than collecting owned pairs for the worker crate to serialize.
serde.workspace = true
# For the call registry's payloads: `Call::params` and a `Return`'s result are JSON, and the
# `config.describe` answer is a redacted `serde_json::Value`. Already in the graph — `volucer-worker`
# and `volucer-core` both use it — so naming it here adds no crate.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
# Enables the `redis` KV driver and the Redis client that serves it — and the lock driver, which
# shares the client. A build without it links no Redis at all.
redis = ["volucer-kv/redis", "volucer-core/redis", "volucer-lock/redis", "volucer-jobs/redis"]
# The AMQP job driver, on the same rule as `redis`: a build without it refuses `driver = "amqp"` by name
# rather than starting a server whose every push would fail.
amqp = ["volucer-jobs/amqp", "volucer-core/amqp"]
[dev-dependencies]
# The skip gate. Shared rather than copied: VOLUCER_E2E=1 has to mean the same thing in every
# suite, and it did not — see the crate's own docs for what that cost.
volucer-testkit.workspace = true
# An empty request body, so an upstream test needs no listener to make one.
http-body-util.workspace = true
# A log sink for the one test that asserts a `warn!` line an operator would see — the worker whose
# stderr the startup hint points at. A writer that appends to a `String` is all that is wanted; this
# brings the subscriber to put it behind, not a test harness.
tracing-subscriber.workspace = true
# `#[tokio::test]` for the async transport's tests, and `tokio::io::duplex` for a pair of
# in-memory halves. Both are test-only: the crate's own code builds its runtimes explicitly, so it
# needs neither the macro nor a test fixture at runtime. `rt` is what the macro expands to.
tokio = { workspace = true, features = ["net", "macros", "rt", "io-util", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# `killpg` and `PR_SET_PDEATHSIG` have no wrapper in `std`, and both are what makes a child die
# with its parent on Unix. `volucer-fcgi` takes the same dependency for `TCP_QUICKACK`, for the
# same reason: a Linux socket option with no `std` equivalent.
libc = "0.2"

