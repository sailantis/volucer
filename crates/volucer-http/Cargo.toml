[package]
name = "volucer-http"
description = "The HTTP front-end for volucer: a hyper listener that translates HTTP to the CGI environment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# gzip for dynamic responses. `zlib-rs` is a *pure Rust* backend and one of the fastest
# available, which matters here specifically: this project already pays for a C toolchain in
# `aws-lc-rs`, and adding a second C dependency for a deflate encoder would repeat that cost
# for no measurable gain. No `default-features`, so `miniz_oxide` and the C `zlib` are not
# compiled at all.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# zstd, bindings to the reference C implementation. Its window is clamped to 8 MiB in
# `compress.rs`, which is what browsers accept. See that module's documentation for the
# measurements behind both choices.
zstd = "0.14"
volucer-core.workspace = true
volucer-fcgi.workspace = true
volucer-server.workspace = true
volucer-watch.workspace = true
# The HTTP front-end's other half: a request that goes to an origin instead of a backend. Only
# this crate needs both, because it is the only place that knows which kind a route selected.
volucer-upstream.workspace = true
# The request id, the trace context and the access log. Both front-ends need it, and only this
# crate and `volucer-server` depend on it — see the note in that crate's manifest for why the
# decision is shared rather than per-listener.
volucer-observe.workspace = true
# The registry behind `/metrics` and the `rr_http_*` names. A leaf crate with one dependency; see
# its own manifest for why the exposition encoder is written by hand rather than taken from the
# `prometheus` crate.
volucer-metrics.workspace = true
volucer-acme.workspace = true
volucer-worker.workspace = true
# The worker-control routes answer JSON, which is the same document `workers.list` returns over the
# worker channel — one encoder for both, so a field added to `WorkerStatus` appears in neither
# answer twice. Already in the graph through `volucer-server`; naming it adds no crate.
serde.workspace = true
serde_json.workspace = true
arc-swap.workspace = true
bytes.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rustls-acme.workspace = true
# For the generated placeholder a `[server.tls]` without a certificate gets. A real dependency
# rather than a dev one because the *server* generates it, not a test.
rcgen = "0.13"

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", features = ["custom-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = "0.26"
# For the composition test: building a real `AcmeState` so `ChallengeResolver` can be exercised
# against the dependency's own exact-ALPN rule rather than against a stub that reimplements it.
rustls-acme = { version = "0.15", default-features = false, features = ["aws-lc-rs", "webpki-roots"] }
volucer-acme.workspace = true
