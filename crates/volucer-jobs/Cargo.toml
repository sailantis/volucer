[package]
name = "volucer-jobs"
description = "Queues for volucer: the driver trait and the in-memory driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The same two the KV and lock crates have, and for the same reason: the refusals a caller must read are
# the only thing a driver needs, and every driver past `memory` is behind a feature so that a single-node
# deployment links no client at all.
tracing.workspace = true
thiserror.workspace = true
# The `script` feature is on here and off at the workspace level, and here it earns its keep differently
# than in `volucer-lock`: a reserve is a *claim*, and claim-then-write in two round trips is a race two
# consumers win together. One Lua script makes the pop and the reservation one operation. It pulls in
# `sha1_smol` and nothing else, which is what makes it a reasonable ask — the alternative is sending a
# kilobyte of script text on every reserve.
redis = { workspace = true, features = ["script"], optional = true }

[features]
default = []
# The Redis driver. The client is shared with `volucer-kv` and `volucer-lock` and named here as an
# optional dependency rather than through a re-export, for the same reason those two name it separately:
# a feature that enabled another crate's module would couple the drivers' versions for no reason.
redis = ["dep:redis"]

[dev-dependencies]
# The integration tests in `tests/redis.rs` drive the driver through the client directly, to check facts
# about the *server* rather than about this crate's API — that a leaked job's key really expires, and that
# a reservation is a hash field rather than a promise. Gated through the same feature.
redis = { workspace = true, features = ["script"] }
