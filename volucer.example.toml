# Example volucer configuration.
#
# Validate it with:  volucer check --config volucer.example.toml
# Extra PHP search directories can be added with `--php-dir`.
#
# ${NAME} and ${NAME:-default} anywhere in this file are expanded from the
# server's environment BEFORE it is parsed, so they work in a number, a port or a
# listener address as well as in a string:
#
#   http    = "127.0.0.1:${PORT:-8080}"
#   workers = ${WORKERS:-0}
#
# Only the braced form is expanded -- a bare $NAME is left exactly as written, so
# a password or a DSN containing `$` cannot be mangled. `$$` is one literal `$`.
# An unset variable without a `:-default` stops the server and names the line,
# because an empty listener address is a server that binds nothing for a reason
# nothing logs. See docs/01-CONFIGURATION.md.

# The backend used when a request matches no route. It belongs to `[server]`, which is the
# unnamed site: `[sites.<name>]` overrides it for one host, exactly as it overrides
# `document_root` or `front_controller`.
[server]
http = "127.0.0.1:8080"
default_backend = "app"
# nginx-facing listener; use a unix socket on Linux/macOS.
fastcgi = "127.0.0.1:9080"

# Where the application lives. Both of the next two keys are also `serve`
# command-line flags, and a flag wins over the file -- so a systemd unit or a
# container image can describe its whole deployment here instead of carrying
# arguments. `volucer check` prints the path and controller it actually
# resolved, which is the fastest way to see what a running deployment uses.
#
# document_root = "./public"
#
# The front controller, relative to the document root. This is what keeps a
# framework working: a path that names no file is given to this script, with
# PATH_INFO set, instead of answering 404. Use `--front-controller ''` on the
# command line for "only real .php files" -- an empty value is not written here,
# because TOML cannot tell an empty string from an absent key.
# front_controller = "index.php"

# The largest request body either front-end will accept, in bytes. Absent means
# 32 MiB, which is what was hard-coded here before this key existed, so a
# deployment that says nothing keeps its behaviour. `volucer check` prints the
# value in effect, including the default.
#
# **Bytes, not megabytes**, and the unit is in the name to keep it obvious:
# RoadRunner spells this `http.max_request_size` and counts megabytes, so
# copying that spelling here is an error rather than a silently different unit.
#
# It bounds both listeners. That is the point of it being configuration: the
# FastCGI front-end had no bound at all before this, so a request forwarded by a
# proxy with no `client_max_body_size` of its own could make volucer buffer
# without limit.
#
# It does NOT bound an `upstream` backend, whose body streams to the origin
# unread; the limit to configure for one of those is the origin's. See the
# README, *Backends*.
#
# Zero is refused rather than read as "unlimited" -- a zero here refuses every
# request with a body, which is never what was meant.
# max_body_bytes = 33554432     # 32 MiB
# What a backend is handed as its `traceparent`. The four values are nginx's
# `otel_trace_context`, with the same meaning:
#
#   "ignore"     reads nothing, writes nothing
#   "extract"    reads the client's trace and continues it; the client's header
#                still reaches the backend unchanged  <- the default
#   "inject"     starts a trace here and hands it to the backend
#   "propagate"  reads the client's trace, and hands the backend *our* span id
#
# `extract` is the default because it is what this server has always done: the
# client's header is relayed, so a backend's spans are *siblings* of this
# server's span. `propagate` replaces it, so they become *children* -- which is
# what makes a waterfall diagram show one request rather than two branches.
#
# It works without a `[telemetry]` table, and that is the point: the deployment
# that needs it most exports nothing from here (nginx in front, a collector
# behind the application) and still has to give the backend a context to join.
# trace_context = "propagate"

# ---------------------------------------------------------------------------
# The environment every process this deployment starts inherits: a worker pool,
# a job consumer, a php-cgi slot and a supervised upstream origin. Written once
# here, and overlaid by any backend's own `env` -- so the shared value is not
# repeated per table and an exception is still expressible on the one table that
# needs it.
#
# `attach` does not receive it: volucer starts those processes not at all.
#
# Names are passed exactly as written. RoadRunner uppercases `server.env` keys;
# a server that silently renamed one would leave an application reading
# `app_env` from a file that says `APP_ENV`.
#
# Every value in this table is a secret as far as `config.describe` is
# concerned: the call reports the names and elides the values, which is what
# makes `${DATABASE_PASSWORD}` in this file safe to send to a worker.
#
# [server.env]
# APP_ENV = "production"
# DATABASE_URL = "postgres://app@db/app"

# The version of the volucer that started a process. Set for every process,
# *after* the tables above, so it cannot be shadowed -- a variable an operator
# could overwrite would sometimes name the wrong server. A php-cgi per-request
# process and a supervised origin have no channel to ask, which is why it exists;
# nothing in the SDK reads it.
#
# It is set by the server, so there is nothing to write for it here.

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# TLS. The presence of `[server.tls]` is what turns it on -- there is no
# `enabled` flag, because a flag and a certificate are two statements about one
# thing and two statements can disagree.
#
# A relative certificate/key path is resolved against the directory holding this
# file (not the process's working directory, which is the rule document_root
# follows). `volucer check` prints the path it resolved.
#
# Three shapes, all supported:
#
#   1. TLS only, on `http`:
#        [server]  http = "0.0.0.0:443"
#        [server.tls]  ...                      (plain = false, the default)
#
#   2. Plain and TLS on ONE port. A TLS record always begins with the byte 0x16
#      and a plaintext request begins an ASCII method letter, so the first byte
#      decides which of two paths a connection takes. This is what nginx's
#      ssl_preread does. It is NOT a downgrade: a client that offers TLS and
#      fails the handshake still fails.
#        [server]  http = "0.0.0.0:443"
#        [server.tls]  plain = true
#
#   3. Plain on :80 and TLS on :443, the conventional pair.
#        [server]  http = "0.0.0.0:80"
#                  https = "0.0.0.0:443"
#
# Note on ACME: `[server.acme]` below uses the **tls-alpn-01** challenge, which
# is validated on the TLS port -- so it works in shape 1 or 2 as well, and needs
# no :80. (`http-01` would need :80 *and* a dotfile policy change, because
# /.well-known/... is refused by the static layer.)
# ---------------------------------------------------------------------------
# [server.tls]
# certificate = "certs/default.crt"   # PEM chain, leaf first
# key = "certs/default.key"           # PEM private key
# min_version = "1.2"                 # or "1.3"; a floor, not a cap
# alpn = ["h2", "http/1.1"]           # h2 preferred; do NOT drop http/1.1
# plain = false                       # accept cleartext on the TLS port too
#
# Answer cleartext requests with a 301 to the https:// equivalent. Off by
# default: it changes what an existing cleartext deployment does. Needs a
# plaintext listener to act on -- either a separate `https`, or `plain = true`.
# Also a per-site key ([sites.<name>].redirect_to_https), for the deployment
# where one site is deliberately cleartext and the rest are not.
# redirect_to_https = false
#
# Strict-Transport-Security, sent on every HTTPS answer for the sites that do
# not state their own. Absent means no header. `max_age_s` is required here
# because there is nothing to inherit from; `max_age_s = 0` is refused (in the
# header it means "delete the policy"), and `preload = true` needs
# include_subdomains and at least a year.
# [server.hsts]
# max_age_s = 300
# include_subdomains = false
# preload = false
#
# A per-site certificate, presented by SNI for that site's hosts. Only the
# certificate and key can be per site, because the name is claimed before any
# request exists -- min_version/alpn/plain describe the socket, so setting one
# here is an error rather than a key that silently does nothing.
#
# [sites.shop.tls]
# certificate = "certs/shop.crt"
# key = "certs/shop.key"

# ---------------------------------------------------------------------------
# Automatic certificates (ACME, RFC 8555). An `[server.acme]` table with
# `enabled = true` (the default) is what turns it on, and a deployment without
# one behaves exactly as before.
#
# `[server.tls]` is still what turns TLS on, but its certificate and key may be
# LEFT OUT when ACME is configured: a self-signed placeholder is then generated in
# memory for the names in `domains` and replaced by the first issuance. Nothing is
# written to disk — the placeholder is never trusted, so a private key for it would
# be a liability with no benefit. Naming no pair and configuring no ACME is an
# error, so a deployment cannot serve a placeholder for ever by omission.
#
# `enabled = false` keeps the table and its settings and issues nothing, which is
# how you stage a contact or park an order without deleting anything:
#
#     [server.acme]
#     enabled = false
#     contact = ["mailto:ops@example.com"]    # staged, and used by every site
#     authority = "production"                # that inherits it
#
# A disabled table may leave `domains` out entirely, since it orders nothing.
#
# An issued certificate reaches the running server without a restart — the next
# handshake presents it.
#
# Only `tls-alpn-01` is used, so the certificate is validated on the TLS port and
# no :80 is needed. That port must be publicly reachable and the names must
# resolve here.
#
# `authority` defaults to staging on purpose: a production account has per-week
# rate limits, and a first deployment should spend its mistakes on staging.
# Let's Encrypt is the only authority reachable from here; ZeroSSL and Google
# Trust Services need External Account Binding, which this does not send.
#
# `volucer check` prints the authority, the names, whether a certificate has ever
# been cached, and the days left on each one -- because the failure mode here is
# silence, and an expired certificate is its only symptom.
# ---------------------------------------------------------------------------
# [server.acme]
# enabled = true                                # false = settings only, issue nothing
# domains = ["example.com", "www.example.com"]   # stated, not derived from sites:
#                                                # this is what the cert must COVER
# contact = ["mailto:ops@example.com"]           # the CA's only way to warn you
# authority = "staging"                          # or "production"; staging default
# cache = "acme-cache"                           # relative to this file

# ---------------------------------------------------------------------------
# A site's own certificate, issued for its own names. What a deployment with
# several unrelated hostnames wants: several certificates rather than one
# covering all of them.
#
# `domains` may be LEFT OUT, and is then derived from this site's `hosts` --
# with every wildcard dropped, and dropped ones logged, because `*.corp` is a
# host pattern and a certificate name cannot be one. Nothing left over is an
# error, not an empty order.
#
# `authority`, `contact` and `cache` may also be left out; omitting them inherits
# the deployment's, which keeps several sites' certificates in one directory and
# their orders on ONE account when the contact matches. `contact` is what the
# account is keyed by, so it is the setting to share deliberately rather than to
# repeat.
#
# `enabled = false` stops this site ordering while keeping its settings, and is
# NOT inherited from `[server.acme]`: turning the deployment's orders off must not
# silence the sites, which are the deployments that have several orders.
#
# A site may also name its own [sites.corp.tls] pair *and* have a table here. The
# named pair serves until the order replaces it — the same rule as `[server.tls]`
# plus `[server.acme]`, and how a deployment migrates from a certificate issued
# elsewhere.
#
# A name must belong to ONE table. Listing it in both this and `[server.acme]` is
# refused, naming both: the deployment's challenge source answers a validation
# handshake first, so the site's order could never succeed.
# ---------------------------------------------------------------------------
# [sites.corp]
# hosts = ["corp.internal", "*.corp.internal"]
# document_root = "/srv/corp"
#
# [sites.corp.acme]
# enabled = true                # false = keep these settings, order nothing
# domains = ["corp.internal"]   # or omit to derive from hosts

# ---------------------------------------------------------------------------
# Binding a site to addresses and protocols.
#
# `hosts` alone is a CLIENT'S statement: the Host header is whatever the caller
# typed, so a site claiming an internal name is reachable by anyone who can reach
# the port and send that name. `addresses` makes the decision depend on the
# destination instead — the address the socket accepted the connection on, which
# is the kernel's answer rather than the client's.
#
# Entries are addresses or CIDR ranges, with the same syntax as
# [server.proxy].trusted_subnets. Absent means "any address", which is the
# existing behaviour.
#
# `protocols` narrows to "http", "https" and/or "fastcgi" — the front-end that
# received the request, not X-Forwarded-Proto. A site restricted to "https" does
# not answer the cleartext half of a `plain = true` port.
#
# A site with `addresses` and NO `hosts` is a default for those addresses: it
# answers everything that reaches them, including a name nobody configured. That
# is nginx's `default_server` shape, and it is the one case where a site needs no
# hostname at all.
# ---------------------------------------------------------------------------
# [sites.internal]
# hosts = ["internal.corp"]
# addresses = ["192.168.9.123"]        # ...and only on this address
# protocols = ["http", "https"]        # ...and only over these
# document_root = "/srv/internal"
# redirect_to_https = false            # deliberately cleartext on this address
#
# [sites.internal.hsts]
# enabled = false                      # no policy for a name with no TLS audience
#
# [sites.intranet]
# addresses = ["10.0.0.0/8"]           # no hosts: a default for the range
# document_root = "/srv/intranet"

# ---------------------------------------------------------------------------
# Static files, served from the document root without waking PHP at all. This is
# a routing layer above the backends: a path that names a real file under the
# document root is answered from disk, and a path that names nothing still goes
# to the front controller. Off by default, so enabling it is an explicit choice.
# ---------------------------------------------------------------------------
# [server.static_files]
# enabled = true
# precompressed = false        # serve file.br / file.gz when the client accepts them
# directory_index = true       # index.html, with a 301 from /docs to /docs/
# dotfiles = "deny"            # or "allow"; a denied dotfile answers 404
# cache_control = "public, max-age=3600"
# max_multirange_bytes = 1048576   # a multi-range answer is buffered, so it is capped

# ---------------------------------------------------------------------------
# The access log: one line per completed request, written to its own file.
#
# Absent is OFF, and that is the default so an existing deployment is not changed
# by upgrading. It is deliberately **not** the diagnostic log: an access log that
# shared a verbosity filter with diagnostics would be one setting away from
# silence — debugging a worker loud would flood it, and quieting the diagnostics
# would erase the record of who requested what.
#
# A relative path resolves against the directory holding this file, the same rule
# [server.tls]'s `certificate` follows. `volucer check` prints the path it
# resolved. A missing directory is reported once at startup and requests are
# served without the log — a lost log is not a reason to stop serving.
# ---------------------------------------------------------------------------
# [server.access_log]
# path = "logs/access.log"
# format = "combined"            # "combined" (nginx's shape + two timings) or "json"
# request_id_header = "X-Request-Id"
#   The header an inbound request id is adopted from, and echoed back on. Adopting
#   is the default because "one id across the tiers" is the feature: a request id
#   that changes at every hop cannot correlate a client's log with this one.
#   Set it to "" to always generate a fresh one instead, which is what nginx does.
#   A malformed value from a client is replaced rather than refused.
#
# The line is nginx's `combined` format with three fields appended, so a script
# written for nginx keeps working and reads this too:
#
#   127.0.0.1 - - [16/Oct/2026:21:35:05 +0000] "GET /x HTTP/1.1" 200 21 "-" "curl/8" 0.012 0.004 3f2504e0...
#                                                                                        ^     ^     ^
#                                    whole request (includes the client's own upload) -----+     |     |
#                                    to the origin's first byte, or "-" if there was none ------+     |
#                                    the request id, exactly as the client sent it ------------------+
#
# Spaces, quotes, backslashes and newlines inside a header are escaped as
# \x20, \x22, \x5C and \n, because the format is space-separated and line-based:
# an unescaped space in a User-Agent would otherwise let a client write fields of
# this log line.
#
# SIGHUP CLOSES AND REOPENS THE FILE, which is the half `logrotate` needs. logrotate
# renames the log and signals the process; a server that does not reopen keeps
# writing to the unlinked inode -- every write succeeds, the path holds a fresh
# empty file, and the log is found empty during the incident it was needed for.
# So the reopen is unconditional and happens BEFORE the configuration is re-read: a
# rotation is a change to the filesystem, and a config that fails to parse is not a
# reason to keep writing into a renamed file.
#
#   /var/log/volucer/access.log {
#       daily
#       rotate 14
#       compress
#       postrotate
#           kill -HUP "$(pidof volucer)"    # or: systemctl reload volucer
#       endscript
#   }
#
# Rotation BY SIZE OR AGE is deliberately not built: logrotate knows the deployment's
# retention policy, and a second rotator is a second schedule to get wrong. SIGHUP
# does not change path, format or request_id_header either -- those are chosen at
# startup, and `restart_only` says so on every reload.
# ---------------------------------------------------------------------------
# Behind a reverse proxy: whose word for the client's address is believed.
#
# WITHOUT this table the peer's own address is the client's, which is correct for
# every direct deployment and wrong for every proxied one. Behind nginx a request
# arrives from nginx, so the access log's first field is the proxy and anything
# keyed on the address -- a rate limit, an IP allow-list -- keys on the proxy. That
# failure is invisible from the client's side, which is why the table has to be
# written down rather than inferred.
#
# `trusted_subnets` is a trust list, not a convenience: X-Forwarded-For is a
# request header, so any client can send one. An address from a header is believed
# only when the TCP peer is inside one of these networks, and with the list empty
# (or this table absent) no header is read at all.
#
# Names follow RoadRunner's `http.trusted_subnets`, so an operator migrating from
# it -- or copying an nginx snippet -- keeps the vocabulary.
#
# Restart-only, like `[server.tls]`'s `alpn`: it describes this deployment's
# topology rather than a request, and `SIGHUP` reports that it was not applied.
#
# On the FastCGI listener this table is deliberately NOT consulted. nginx sets
# `REMOTE_ADDR = $remote_addr`, so the param is already the client as nginx
# resolved it; preferring a header there would replace a value the proxy
# established with one the client merely asserted.
# ---------------------------------------------------------------------------
# [server.proxy]
# trusted_subnets = ["127.0.0.1", "10.0.0.0/8"]
#   The networks whose forwarded headers are believed. A bare address is a network
#   of one, which is how a single local proxy is named. Every entry is parsed at
#   startup and a range that does not parse stops the server rather than being
#   dropped: a trust list is somewhere a typo is a security decision, and a
#   shortened list is not visible afterwards.
#
# trusted_headers = ["X-Real-Ip", "X-Forwarded-For"]
#   The headers to consult, IN ORDER -- the first that yields a parsable address
#   wins, so the order is the security-relevant part rather than a preference.
#   Defaults to `Forwarded`, then the X-Forwarded-For family, which is RoadRunner's
#   order. Note what that default does NOT fix: X-Forwarded-For is appended to by
#   every hop, so behind a CDN the left-most element is the client's own CLAIM
#   rather than its address. A deployment that knows its topology should name this
#   list explicitly.
#
#   "Forwarded" is read as RFC 7239 and its `for=` target is taken; every other
#   name is read as a single address, which is what makes a CDN's own header
#   usable without a code change. A blank or repeated name is dropped rather than
#   refused. Four spellings are accepted in a value: `203.0.113.7`,
#   `2001:db8::1`, `203.0.113.7:51234` and `[2001:db8::1]:51234`.

# ---------------------------------------------------------------------------
# Rate limiting: refuse a caller that has spent its allowance.
#
# OFF unless this table is present, and that is the same convention `[status.metrics]`
# and `[server.tls]` follow: an `enabled` flag beside a `rate` is two statements
# about one thing, and two statements can disagree.
#
# A token bucket that refills CONTINUOUSLY, not a windowed counter. nginx's
# `limit_req` resets its count at a window boundary, so a client can spend one
# window's allowance just before the boundary and the next just after, doubling
# the instantaneous rate. A bucket cannot hold more than `burst` and refills at
# a fixed rate, so there is no boundary to exploit.
#
# `key = "ip"` uses the address `[server.proxy]` resolves, NOT the socket peer.
# Behind nginx without that table every request is charged to the proxy and no
# two clients can be told apart -- which is why the row above was built first.
#
# A refusal is `429` with `Retry-After`, and `Cache-Control: no-store` so a shared
# cache cannot serve one client's refusal to another. RoadRunner answers a full
# key table with `503`, which a load balancer reads as "this node is unhealthy"
# and acts on by taking it out of rotation; one client varying a header would then
# cause an outage. A gRPC call is refused as `RESOURCE_EXHAUSTED` in the trailers,
# because a gRPC client cannot read a `429` at all.
#
# Restart-only was the previous rule, and it changed: the buckets are carried
# across a reload whenever `key` and `header` are unchanged, so a tightened
# `rate` throttles a caller from where they already were rather than handing them
# a fresh burst. A limit a reload clears is not a limit, and this is how the
# reloadable version avoids that. Changing `key` or `header` renames every
# bucket, and there is no honest mapping between two identities, so that reload
# starts over and says so in the log.
# ---------------------------------------------------------------------------
# [server.rate_limit]
# key = "ip"
#   "ip" (the default) -- one bucket per client address, as `[server.proxy]`
#                        resolves it;
#   "header"           -- one bucket per value of `header`, and that value is NOT
#                        an authenticated identity: a client chooses it, so a
#                        client that varies it gets a fresh bucket per request
#                        until `max_entries` fills. Use it for a header the proxy
#                        sets, not one the client asserts. Values are hashed
#                        rather than stored, so a long value costs one entry;
#   "global"           -- one bucket for the whole process. Useful as a circuit
#                        breaker, useless for telling two clients apart.
#
# rate = 60
#   Requests allowed per `interval_ms`. Required, and must be at least 1: a rate
#   limit with no rate is a table that appears to protect something and does not.
#
# interval_ms = 60000
#   How long `rate` requests take to accrue. Defaults to 1000 (one second), so
#   `rate = 5` alone means five per second. The unit is in the name, following
#   `[telemetry].interval_ms` and `[backends.pool].ready_timeout_ms`.
#
# burst = 60
#   How many requests may be spent at once, and the capacity of one bucket.
#   Defaults to `rate` -- NOT to RoadRunner's 1, which turns `rate = 60,
#   interval_ms = 60000` into "one request, then one per second": a limit nobody
#   writing that line meant.
#
# max_entries = 10000
#   How many identities one process tracks. A table that is full of DEPLETED
#   buckets refuses a new identity with a `429` rather than evicting somebody's
#   allowance -- a bucket that has refilled is indistinguishable from an absent
#   one, so only those are reclaimed, and the sweep runs when the table is full
#   rather than on a timer.
#
# header = "X-Client-Id"
#   Required when `key = "header"`, and refused beside the other two modes: a
#   header named next to a key that does not read one is a line that believes it
#   limits that header.
# ---------------------------------------------------------------------------
# Persistent worker pool: the process boots the application once and stays
# resident. volucer talks to it over the child's stdin/stdout pipes using its
# own framed protocol. State is NOT reset per request, so the application must
# clear its own request scope.
# ---------------------------------------------------------------------------
[backends.app]
kind = "worker"
command = "php worker.php"
workers = 0               # 0 = one per logical CPU
memory_limit_mb = 256     # recycle a worker above this RSS
max_requests = 1000       # and after this many requests
working_dir = "."
# services = ["config"]   # Namespaces this backend's workers may CALL, mid-request. Absent
                          # means none, which is the safe default: the worker channel is a
                          # remote-execution surface and this key is the only thing limiting
                          # it. "workers" also allows workers.reset, so grant it only to an
                          # operator's worker, never to one facing the public.
#
# grpc_services = ["greeter.Greeter"]
                          # gRPC services this backend's workers may be ASKED TO SERVE. The
                          # opposite direction from `services`, which is why it is a second
                          # key: `services` is what the application may call, this is what may
                          # be delivered to it. Absent means none, for the same reason. Names
                          # are protobuf service names (with their package) and never method
                          # names -- a method the application does not implement is one it
                          # answers UNIMPLEMENTED to itself, which keeps the application's
                          # interface out of this file. A call naming anything else never
                          # reaches a worker: the server answers UNIMPLEMENTED itself, before
                          # the body is read.
                          #
                          # RELOADABLE. A SIGHUP that widens this list takes effect on the next
                          # call, on the same connection, with no restart and no pool rebuild:
                          # the grant is a membership test the front-end makes alone, so nothing
                          # about it is a property of a running process.
                          #
                          # The server never parses a message; a handler is handed the framed
                          # bytes and the method path (`$request->grpcMethod()`) and states its
                          # outcome with `Volucer\GrpcResponse`, whose status the server moves
                          # into the trailer section where gRPC clients read it.
#
# grpc_serve_any = true
                          # The opt-out from the list above: serve EVERY well-formed gRPC method
                          # path and let the application answer UNIMPLEMENTED for what it does
                          # not implement. Refused beside a non-empty `grpc_services`, because
                          # two statements about one thing can disagree. Legal only on `worker`
                          # and `attach`.
                          #
                          # This gives up the boundary the list exists for: an unknown service
                          # now reaches a worker and spends a slot before it is refused. Startup
                          # logs a warning naming the backend, so an opted-out worker facing the
                          # public is visible in the log rather than only in the file. The path
                          # *shape* rule is not relaxed -- `/pkg.Service/Method` is still the
                          # only accepted form.
#
# grpc_proto = ["proto/"]  # Read the services from the application's own `.proto` files
                          # instead of naming them above. The third statement about the same
                          # set, so refused beside both `grpc_services` and `grpc_serve_any`:
                          # only one of the three can be the answer.
                          #
                          # A deployment with `.proto` files already has exactly one reliable
                          # statement of which services exist, and a hand-maintained copy of it
                          # in this file is a second one that eventually disagrees -- in the
                          # silent direction, because a service added and not listed is answered
                          # UNIMPLEMENTED with no log line saying why.
                          #
                          # Each entry is a file or a directory searched recursively, resolved
                          # against this file's own directory. Only `package` and top-level
                          # `service` declarations are read: an `import` is not followed, because
                          # a service's name depends on nothing an import resolves.
                          #
                          # RELOADABLE, like the list: the files are read when the configuration
                          # is loaded, so a SIGHUP re-reads them and a changed set takes effect on
                          # the next call. Two refusals, both whole-or-nothing: a `.proto` that
                          # cannot be read, and a set that resolves to no service at all -- a
                          # backend granted nothing is the failure this key exists to remove.
                          #
                          # `volucer check` prints the entries beside the resolved names, so a
                          # directory that pulls in more than intended (a vendored SDK, another
                          # team's tree) is visible rather than inferred.
# transport = "pipe"      # Defaults to "socket" on Windows and "pipe" elsewhere,
                          # which is the measured winner on each: PHP's stream layer
                          # reads a Windows pipe ~100x slower than a socket, and that
                          # was 21x on the whole route. Set it only to override - and
                          # note a worker must call `Volucer\Worker::connect()`, not
                          # `create()`, to read a socket.
#
# socket = "unix:/run/volucer/worker"
                          # WHERE the socket transport listens. Only meaningful with
                          # `transport = "socket"`, and refused beside "pipe" rather than
                          # ignored -- a key read by nothing is the shape `spawn_fpm` was
                          # removed for. Omitted means the loopback ephemeral port this
                          # backend has always used, so an existing configuration is
                          # unchanged.
                          #
                          # A PREFIX, not a finished path: worker i listens on
                          # /run/volucer/worker.<i>.sock. One socket per worker is what
                          # lets a worker be recycled, counted and reached on its own; a
                          # shared socket would be one queue and `workers` would stop
                          # meaning anything. The same suffix rule as `spawn_cgi`'s
                          # `socket`.
                          #
                          # The directory must exist and be writable by the user running
                          # volucer. `unix:` is required: a bare path is *relative*, so the
                          # value copied from an `external` backend would bind a file named
                          # `unix:/run/...` in the working directory rather than failing.
                          #
                          # There is no `\\.\pipe\` form here, unlike `spawn_cgi`: the
                          # worker protocol needs the connection as a reader and a writer at
                          # once, and a named pipe cannot be cloned into two halves.

# ---------------------------------------------------------------------------
# System php-fpm: the normal Linux/macOS deployment. volucer does not manage
# the pool -- systemd and php-fpm do, including pm.max_requests recycling.
# ---------------------------------------------------------------------------
[backends.fpm]
kind = "external"
socket = "unix:/run/php/php-fpm.sock"

# ---------------------------------------------------------------------------
# Self-contained php-fpm: volucer does not start php-fpm. There is no
# `spawn_fpm` kind -- a file that carries one is rejected by name -- and that
# is a decision rather than a gap. php-fpm already does pool management,
# `pm.max_requests` recycling, multi-pool tenancy and graceful reload better
# than a supervisor written here would, so `external` attaches to the pool
# systemd already supervises. The removed kind parsed and validated while
# startup refused it, which is the shape this file exists not to have.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# HTTP upstream: a runtime that already owns its HTTP loop (Node, Python, Go)
# is reached at its own address and the request is relayed to it. This is not a
# CGI backend: there is no environment to build and no protocol to speak, only
# an HTTP request passed on. The path is handed over as the URL, so the origin
# does its own routing -- a route to one skips volucer's `stat` for the same
# reason a worker's does.
#
# Reachable over HTTP only, and `server.http` must be set. A Windows named pipe
# is not supported: the HTTP client has no pipe transport.
# ---------------------------------------------------------------------------
# [backends.node]
# kind = "upstream"
# origin = "http://127.0.0.1:3000"
#
# A unix socket instead of a loopback port, where the platform has them. Strictly
# less exposed than TCP: there is no address for a stray process to connect to.
# origin = "unix:/run/node.sock"
#
# An `https:` origin is supported and always verified -- there is no
# `verify = false`, because a hop that looks encrypted and checks nothing is
# worse than a plaintext one. `ca` absent means the public roots, which is right
# for a publicly-trusted origin and wrong for an internal service.
# origin = "https://node.internal:8443"
# [backends.node.tls]
# ca = "/etc/ssl/internal-ca.pem"   # absent = the public roots
# sni = "node.internal"             # optional; defaults to the origin's host
#
# gRPC needs HTTP/2, and TLS negotiates that through ALPN on its own -- so only a
# plaintext or unix-socket origin needs to be told. `h2c` is HTTP/2 with prior
# knowledge: the client opens the connection and sends the HTTP/2 preface, with no
# upgrade. That is what a gRPC client does, and it is the only value this key takes;
# absent means HTTP/1.1. It is refused beside an `https://` origin, where the
# handshake is the answer.
# protocol = "h2c"
#
# ---------------------------------------------------------------------------
# Supervising the origin, for a runtime whose own server volucer should start.
#
# Every Python and Ruby application server already implements "boot once, serve
# many" and already speaks HTTP over a unix socket: `gunicorn --preload --bind
# unix:/run/app.sock`, Puma's `preload_app!`, uvicorn, granian. With `command`
# volucer starts that process, waits until it answers, restarts it if it dies,
# and makes sure it does not outlive the server.
#
# There is deliberately no `kind = "python"`: HTTP framing is a real cost, and it
# is the cost every Rails and Django deployment already pays. What was missing
# was supervision, not a protocol.
#
# Paths are written in single quotes. A TOML basic string ("...") needs every
# backslash doubled, so a Windows path is a parse error in one and unchanged in
# the other.
# ---------------------------------------------------------------------------
# command = 'gunicorn myapp.wsgi --bind unix:/run/app.sock --workers 4'
#
# Where the application expects to be started. `manage.py` and `config.ru` are
# found relative to this, so guessing here is a boot failure the operator reads
# as a volucer bug.
# working_dir = '/srv/app'
#
# DJANGO_SETTINGS_MODULE, RAILS_ENV, and the rest. The socket path itself is not
# overridden here: it is the configuration's, and moving it in the environment
# would point the supervisor at one address and the client at another.
# env = { DJANGO_SETTINGS_MODULE = "myapp.settings" }
#
# What to do when the process exits. `on_failure` (the default) starts it again
# only after a *non-zero* exit: a `gunicorn` that exited 0 was stopped by
# somebody, and restarting it would fight them.
# restart = "on_failure"          # "never" | "on_failure" | "always"
#
# How many *consecutive* failures to restart through, and the delay before each,
# which doubles per failure up to 60 s. A limit rather than a loop because a
# command that cannot start -- a typo in a module name, a missing virtualenv --
# exits in milliseconds, and an unbounded restarter is a core burned and a log
# filled while the backend answers nothing. A run that stayed up a minute resets
# the count, so this is not a lifetime restart budget.
# restart_limit = 3
# restart_backoff_ms = 1000
#
# How long the origin has to answer before startup gives up. The readiness gate,
# and the reason it is 30 s rather than the CGI pool's 10: a Django app under
# `gunicorn` is not listening the instant it is spawned. Without this the first
# requests after a deploy are 502s from an origin that is merely still booting.
# ready_timeout_ms = 30000

# ---------------------------------------------------------------------------
# Routes. The most specific matching route wins: a route stating both a host and
# a path beats one stating only a path, and ties go to the earlier entry. A
# request that matches no route goes to `server.default_backend`.
#
# **They are `[[server.routes]]`, not `[[routes]]`**: routing is what the unnamed
# site does, so the table lives beside that site's `document_root` rather than at
# the top of the file. A `[sites.<name>]` table states its own `routes`, which
# *replaces* this list rather than adding to it.
#
# `path_prefix` is a textual prefix, like nginx's `location`. `host` is a bare
# host name with no port, and is compared case-insensitively.
# ---------------------------------------------------------------------------
# [[server.routes]]
# path_prefix = "/api"
# backend = "cgi"
#
# [[server.routes]]
# host = "admin.example.com"
# path_prefix = "/"
# backend = "fpm"

# ---------------------------------------------------------------------------
# php-cgi pool: N processes on N ports. The only option on Windows, where
# php-fpm does not exist. Each process gets full per-request SAPI reset.
# ---------------------------------------------------------------------------
[backends.cgi]
kind = "spawn_cgi"
binary = "C:/php-8.3.31/php-cgi.exe"
workers = 8
bind_host = "127.0.0.1"   # loopback only; never expose php-cgi
base_port = 19001

# A unix socket instead of TCP, where the platform has them (Linux, macOS).
# This is a path PREFIX: slot 0 binds /run/volucer/cgi.0.sock, slot 1 the next.
# `php-cgi -b` accepts an AF_UNIX path on any non-Windows platform, which removes
# the loopback hop. `bind_host`/`base_port` are then unused.
# socket = "unix:/run/volucer/cgi"

# A named pipe instead of TCP, on Windows. `php-cgi -b` takes a pipe name there
# rather than `host:port`, so this is the equivalent of the unix socket above and
# the fastest transport this backend has: on the reference machine a 4 KiB request
# costs ~168 us over a pipe against ~211 us over loopback TCP. As with `unix:`,
# this is a PREFIX — slot 0 becomes \\.\pipe\volucer-cgi.0 and slot 1 the next.
# `bind_host`/`base_port` are then unused.
# socket = '\\.\pipe\volucer-cgi'

# `children = 0`
# PHP processes per slot, sharing that slot's listening socket. 0 -- the default --
# means one, which is what every configuration written before this key meant.
#
# This is PHP_FCGI_CHILDREN, and it is the measured memory win: with the PHP process
# count held equal at 16, one master with 16 children measured 68 MB PSS against
# 312 MB for 16 separate slots, with throughput within noise and slightly ahead --
# because the compiled scripts exist once instead of sixteen times.
#
# It was 0 for a long time because a slot that hides children cannot be counted,
# recycled or killed as a unit. What changed is that the pool now declares the slot's
# concurrency and its address, so the children are no longer hidden from it. What has
# not changed is that php-cgi cannot multiplex requests on one connection, so this is
# the only way to get more than one concurrent request out of a slot.
#
# `max_requests` stays slot-wide: each child counts its own requests and php-cgi
# gives no way to read those from outside, so the count the pool acts on is the
# slot's, and the whole group is replaced together.
#
# `children` counts CHILDREN, not processes: php-cgi forks them in addition to itself,
# so `workers = m` and `children = n` is m masters plus m*n children -- m*(n+1)
# processes. `children = 1` is therefore mapped to 0, because one child on top of one
# master is two processes for a slot that still serves one request at a time. Size
# `children` to the cores and `workers` to the memory you have.

# Environment variables for every slot, merged over `[server.env]`. Written after
# PHP_FCGI_CHILDREN and PHP_FCGI_MAX_REQUESTS, so a table here cannot move either
# number the pool enforces.
#
# This is the only way an application under php-cgi is configured: the CGI
# environment volucer builds per request carries request data and nothing else.
# Without this key a deployment whose whole PHP configuration is `spawn_cgi` had
# no way to set APP_ENV at all.
# env = { APP_ENV = "production" }

# ---------------------------------------------------------------------------
# The same backend with any other FastCGI server. `command` and `binary` are
# mutually exclusive: `binary` is php-cgi's own argv (-b) plus its prefork
# environment, `command` is a program that binds the address it is given.
#
# `{address}` is replaced per slot -- 127.0.0.1:19001, or unix:/run/app/py.0.sock
# when `socket` is set -- in every argument, and the same string is exported as
# VOLUCER_FCGI_ADDRESS for a program that reads it from the environment. A
# command using neither is refused at startup: it would bind somewhere the pool
# cannot reach, and every request would be a 502 after the startup timeout.
#
# `concurrency`, not `children`, is how many requests one slot answers at once --
# per slot, not for the backend: the backend's ceiling is `workers` x `concurrency`.
#
# The command runs once per slot, each time with a different {address}, so whatever
# the command is told to fork belongs to ONE address -- and that is this number.
# `gunicorn --workers 4 ... {address}` is `concurrency = 4`; `workers = 4` beside it
# starts that command four times: sixteen processes, four per address. A server that
# also threads multiplies the two. Setting both keys is refused.
#
# `{concurrency}` is that number, substituted, so it is written once instead of
# twice: `command = "gunicorn myapp.wsgi --workers {concurrency} --bind {address}"`
# cannot drift from the key, where `--workers 4` beside `concurrency = 4` is two
# copies to keep in step. It is replaced with the resolved value, so `concurrency`
# omitted (0, meaning one) tells the program `1` and not a zero it would read as
# "start no workers". `{workers}` is NOT a placeholder -- a slot has no sibling
# count to be told -- and is refused by name.
#
# `working_dir` matters here in a way it does not for php-cgi: a Python
# application finds its modules relative to the working directory, and a Ruby one
# finds config.ru there.
# ---------------------------------------------------------------------------
# [backends.py]
# kind = "spawn_cgi"
# command = "gunicorn myapp.wsgi --workers {concurrency} --bind {address}"
# workers = 4
# concurrency = 4
# working_dir = "/srv/app"
# env = { APP_ENV = "production" }
#
# A unix socket is handed over in `unix:` form, which is what the rest of the
# world spells a socket -- and what `php-cgi -b` does NOT accept, which is why
# the two drivers spell this one argument differently.
# socket = "unix:/run/volucer/py"

# ---------------------------------------------------------------------------
# The same backend with any other FastCGI server. `command` and `binary` are
# mutually exclusive: `binary` is php-cgi's own argv (-b) plus its prefork
# environment, `command` is a program that binds the address it is given.
#
# `{address}` is replaced per slot -- 127.0.0.1:19001, or unix:/run/app/py.0.sock
# when `socket` is set -- in every argument, and the same string is exported as
# VOLUCER_FCGI_ADDRESS for a program that reads it from the environment. A
# command using neither is refused at startup: it would bind somewhere the pool
# cannot reach, and every request would be a 502 after the startup timeout.
#
# `concurrency`, not `children`, is how many requests one slot answers at once --
# per slot, not for the backend: the backend's ceiling is `workers` x `concurrency`.
#
# The command runs once per slot, each time with a different {address}, so whatever
# the command is told to fork belongs to ONE address -- and that is this number.
# `gunicorn --workers 4 ... {address}` is `concurrency = 4`; `workers = 4` beside it
# starts that command four times: sixteen processes, four per address. A server that
# also threads multiplies the two. Setting both keys is refused.
#
# `{concurrency}` is that number, substituted, so it is written once instead of
# twice: `command = "gunicorn myapp.wsgi --workers {concurrency} --bind {address}"`
# cannot drift from the key, where `--workers 4` beside `concurrency = 4` is two
# copies to keep in step. It is replaced with the resolved value, so `concurrency`
# omitted (0, meaning one) tells the program `1` and not a zero it would read as
# "start no workers". `{workers}` is NOT a placeholder -- a slot has no sibling
# count to be told -- and is refused by name.
#
# `working_dir` matters here in a way it does not for php-cgi: a Python
# application finds its modules relative to the working directory, and a Ruby one
# finds config.ru there.
# ---------------------------------------------------------------------------
# [backends.py]
# kind = "spawn_cgi"
# command = "gunicorn myapp.wsgi --workers {concurrency} --bind {address}"
# workers = 4
# concurrency = 4
# working_dir = "/srv/app"
# env = { APP_ENV = "production" }
#
# A unix socket is handed over in `unix:` form, which is what the rest of the
# world spells a socket -- and what `php-cgi -b` does NOT accept, which is why
# the two drivers spell this one argument differently.
# socket = "unix:/run/volucer/py"

# ---------------------------------------------------------------------------
# Metrics, in the Prometheus text format. The presence of this table is what
# turns the endpoint on -- there is no `enabled` flag, because a flag and an
# address are two statements about one thing and two statements can disagree.
#
# It listens on its OWN address rather than becoming a route on [server]. The
# HTTP listener may be TLS-only, may redirect to HTTPS, and faces the public;
# a scrape endpoint inheriting any of that would be one misconfiguration away
# from being unreachable, or public. Loopback plus a firewall rule is the shape
# this is meant to have.
#
# The names are RoadRunner's (`rr_http_request_total` and friends), kept
# deliberately so an existing dashboard works unchanged. `prefix` is prepended
# at render time, so `prefix = "myapp_"` yields `myapp_rr_http_request_total`.
# `path` exists because a deployment may already reverse-proxy `/metrics` for
# something else, and a fixed path would make that a routing conflict rather
# than a naming choice.
#
# Worker pools are described by rr_http_total_workers, rr_http_workers_ready,
# rr_http_workers_working, rr_http_workers_invalid, rr_http_worker_state{pid,
# state}, rr_http_worker_memory_bytes{pid}, rr_http_workers_memory_bytes,
# rr_http_request_total{status}, rr_http_request_duration_seconds{status},
# rr_http_requests_queue, rr_http_no_free_workers_total and
# rr_http_uptime_seconds. No label is taken from the request, so the number of
# series depends on the deployment rather than on what clients ask for.
#
# A worker may also publish its own sample: the PHP SDK's Worker::emitMetric
# sends a METRIC frame that this server decodes, and the sample lands in this
# registry under the name the deployment declared in [metrics.collect] below.
# Those are the only metrics whose cardinality is the application's business.
#
# A sample whose name is not declared is refused, deliberately -- otherwise an
# application could widen the published set at runtime. So the table is not an
# optional extra: without it, emitMetric does nothing that anyone can see.
#
# AND WITHOUT THIS TABLE NOTHING DRAINS THE QUEUE. A worker's sample is held in
# a per-pool queue until a scrape takes it, and `publish_metrics` has exactly one
# caller -- the scrape. A deployment with an access log and no [status.metrics] table
# therefore never drains it; an earlier version grew for the process's life while
# its own documentation said the drain bounded it. The queue is now capped at
# 4096 samples per pool, and what does not fit is counted and reported three ways
# rather than silently lost:
#
#   volucer_metrics_dropped_total   -- on a scrape, so a graph shows the gap.
#                                      NOT rr_http_*: that set is RoadRunner's,
#                                      and this series is volucer's own decision.
#   a warning, one per 1024 samples  -- so the log of a deployment with no
#                                      [status.metrics] table says so;
#   a line at shutdown               -- printed only when something was lost.
#
# 4096 is far above what a scrape a minute needs, so it is not a throughput limit
# -- what it bounds is a deployment that emits and never drains.

# ---------------------------------------------------------------------------
# [status]
# listen = "127.0.0.1:2112"
#
# [status.metrics]
# prefix = "myapp_"
# path = "/metrics"
#
# The collected metrics are a table, and it may be written two ways. Both mean
# the same thing. An inline table is closed *in the text that writes it* --
# a later [status.metrics.collect.<name>] header, or a dotted key, is refused with
# "cannot extend value of type inline table". An `-o` override is laid onto the
# parsed table instead, so it adds an entry to either spelling.
#
# [status.metrics.collect.app_orders_total]
# type = "counter"          # counter | gauge | histogram
# help = "Orders the application counted"
#
# [status.metrics.collect.app_queue_depth]
# type = "gauge"
# help = "Jobs waiting to be consumed"
#
# [status.metrics.collect.app_latency_seconds]
# type = "histogram"
# help = "Time the application took to answer"
# buckets = [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]
#
# The same three, as an inline table. TOML 1.1 is what allows the newlines and
# the trailing commas -- the workspace pins `toml = "1"` for exactly this:
#
#   collect = {
#       app_orders_total = { type = "counter", help = "Orders the application counted" },
#       app_queue_depth = { type = "gauge", help = "Jobs waiting to be consumed" },
#       app_latency_seconds = {
#           type = "histogram",
#           help = "Time the application took to answer",
#           buckets = [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0],
#       },
#   }
#
# What `type` decides is what a sample *means*, because emitMetric sends a name
# and a value and the worker does not know what it is counting: a counter's
# sample is an increment (a whole, non-negative number), a gauge's is the value
# now, and a histogram's is one observation. A name has to be a Prometheus name
# -- letters, digits and underscores, no dots -- and may not begin with "rr_",
# which is this server's own namespace.

# ---------------------------------------------------------------------------
# Health and readiness. Two endpoints on one listener, because they answer
# different questions and the difference is the one a container orchestrator
# acts on:
#
#   GET /health  -- the process is alive and should not be restarted. 200 while
#                   the server is running, even if no worker is ready yet.
#   GET /ready   -- it can serve traffic now and should be sent some. Answers
#                   `unavailable_status` until every configured service
#                   reports ready, and 200 afterwards.
#
# A readiness probe that returned 200 while the pools were still booting is how
# a rolling deploy sends traffic to a server that answers 502.
# ---------------------------------------------------------------------------
# [status]
# listen = "127.0.0.1:2114"
#
# What the listener serves is decided by which sub-tables it carries, and by
# nothing else -- the same presence-is-enablement rule [server.tls] follows. The
# probes are always there, because a [status] table that carried none would be an
# address that answers nothing.
#
# [status.health]
# unavailable_status = 503   # some load balancers expect 503 specifically
#
# [status.metrics]
# path = "/metrics"          # the default
# prefix = "myapp_"
# collect.example_total = { type = "counter", help = "..." }
#
# [status.workers]
# allow = ["workers.list"]
#
# `[status.metrics]` absent means no exposition on this port. `[status.workers]`
# absent means neither worker route exists.
#
# The worker grant is a *method* list rather than a boolean, because the two
# routes are not equally dangerous:
#
#   "workers.list"  -- GET  /workers               JSON, the same document the
#                                                  workers.list call answers
#   "workers.reset" -- POST /workers/{index}/reset recycle one worker, 200 with
#                                                  its index
#
# A deployment that wants to *see* a pool should not have to arm a POST to do it,
# so allow = ["workers.list"] publishes the list and answers 404 to a reset.
# Naming both adds the recycle. An empty allow is refused: a table that grants
# nothing is a block written expecting an endpoint.
#
# `{index}` is the global one from the GET, so `curl -f -XPOST` is the whole
# command: no subcommand, no client, and `-f` fails on 404 (no such worker), 409
# (that worker is serving a request, try again) and 500 (the replacement did not
# boot). **There is no authentication**: what protects this is that a route does
# not exist until its method is granted, which is why an ungranted one answers
# 404 -- not 403 -- for the path.
#
# `workers.reset` on a wildcard `listen` is refused rather than warned about: a
# POST with no authentication that recycles a worker, reachable from anywhere, is
# a remote kill switch. `workers.list` alone is legal on any address -- a list of
# workers is a fact about this process, not a lever on it.
#
# RELOADABLE, in both directions. A SIGHUP that removes a method makes its route
# stop existing on the next request -- a 404, the same answer a deployment that
# never granted it gives -- so an unauthenticated mutation surface can be closed
# without restarting a serving process. Adding `workers.reset` is subject to the
# same wildcard-address refusal through a reload as at startup, because that
# check runs when the file is read.
#
# `listen` is not reloadable: the socket is already bound.
#
# [status.workers]
# allow = ["workers.list"]

# ---------------------------------------------------------------------------
# Where spans are exported. Absent means none are, and this is a *push*:
# unlike the `[status.metrics]` scrape above, an exporter that cannot reach its
# collector keeps trying for as long as traffic lasts, so the two tables are
# separate on purpose and a deployment may reasonably have either alone.
#
# `endpoint` is required and is the collector's base address -- the `/v1/traces`
# path is the protocol's, not yours, and is appended. Write it with no path, or
# paste a full URL including `/v1/traces`: both are accepted.
#
# The `traceparent` this server hands a backend is decided by
# `[server] trace_context`, not here -- see the `[server]` section above. Under
# the default, `extract`, the client's header is relayed untouched and a
# backend's spans are *siblings* of this server's span. `propagate` replaces it
# with this server's own context, which is what makes them children of one
# request in a trace view.
#
# A batch fills up and is sent, or waits `interval_ms` and is sent anyway --
# which is what makes a service handling one request a minute still produce
# traces. A collector that is down costs dropped batches and one warning, never
# a failed request: the same rule the access log follows for a full disk.
#
# `sample` decides which traces leave this process. It is not the same question
# as `[server] trace_context`: that says what a *backend* is handed and works
# with no [telemetry] table at all, while this says what is sent to the
# collector. The default, `parent_based`, records a caller that asked to be
# recorded and also a request that arrived with no traceparent at all -- a
# *root*, which is what a deployment with nothing in front of it produces. That
# second half is why the default is not "export nothing until told": a caller
# that explicitly says `-00` is obeyed, and a caller that says nothing is not.
# nginx spells the same rule `otel_trace $otel_parent_sampled`.
#
# `ratio` exports a deterministic fraction of traces, chosen from the trace id,
# so every hop applying the same fraction agrees about the same trace. Lowering
# it only ever removes traces, which lets a backend sample more generously than
# this front-end without losing anything this one kept. `0` and `1` are exact,
# and the smallest non-zero value is 2^-56 -- the resolution of the 56 bits of
# trace id the decision reads. `sample_ratio` on any other mode is refused
# rather than ignored, the same rule [metrics.collect].buckets follows.
#
# Sampling never touches the access log and never changes the trace id: a
# dropped trace is still logged with the id to search for.
# ---------------------------------------------------------------------------
# [telemetry]
# endpoint = "http://127.0.0.1:4318"
# service_name = "volucer"
# sample = "parent_based"   # "parent_based", "always" or "ratio"
# sample_ratio = 0.1        # only with sample = "ratio"
# timeout_ms = 10000        # per export request, not a total budget
# batch_size = 512
# interval_ms = 5000        # send a partly-filled batch after this long
#
# Headers are sent with every export, for a hosted collector that wants a key.
# The values are redacted by `volucer check` and `config.describe`.
# [telemetry.headers]
# "x-honeycomb-team" = "..."

# ---------------------------------------------------------------------------
# Key-value storages, by name. Absent means none, and then a worker cannot
# call `kv.*` at all -- the same rule every service follows: what a worker can
# reach is what its backend's `services` list names, and nothing else.
#
# Three drivers, and the choice is about where the cache lives.
#
# `memory` is in this process: the map is shared by every worker, which is the
# point, since a PHP static is per-worker and a pool of 8 workers gives an
# application cache a hit rate of 1/8 with no way to invalidate. It is lost on
# restart.
#
# `file` is the same sharing across a restart, and `redis` across processes.
#
# max_bytes bounds the *values* stored, not the process's heap -- the hash map
# holding them costs roughly two to three times as much again, so 64 MiB here
# is a few hundred MiB of resident memory at worst. A value that will not fit
# is refused rather than evicting something else, and the refusal is logged.
# When the store is full it first sweeps expired entries, so a cache of
# short-lived items reclaims itself.
#
# `Kv::setIfAbsent` is the one method here that is not PSR-16, and it is the
# answer to what a lock cannot do: a conditional write, where the storage
# decides who won. `true` means this call's value is the one under the key and
# `false` means somebody else's already was -- a success, not a failure, so do
# not retry it. Atomic per driver (`SET NX` on redis, `O_CREAT|O_EXCL` on file,
# a shard lock in memory), which a client-side `has` then `set` would not be.
# ---------------------------------------------------------------------------
# [kv.sessions]
# driver = "memory"
# max_bytes = 67108864            # 64 MiB; the default

# Redis, shared between processes and surviving a restart of this one. Needs a build with the
# `redis` feature -- `cargo install volucer --features redis` -- or `volucer check` refuses this
# table by name rather than starting a server whose calls would all fail. A URL rather than
# separate host/port/password keys because that is what every other Redis client takes.
#
# `rediss://` for TLS. A password in a `redis://` URL is refused rather than warned about: an
# operator who wrote one has probably not noticed that it crosses the network in the clear, and a
# configuration file is the one place nobody is watching a log when the decision is made.
#
# Every key this storage writes is prefixed `volucer:kv:<name>:`, which is what lets two storages
# share one server -- a `clear` on one cannot empty the other. That prefix is also what to search
# for when clearing a stale cache by hand.
# A directory of files, one per key. Survives a restart and needs no server -- the driver for a
# single node that has a disk and no Redis, which is the deployment whose session store would
# otherwise be emptied by every deploy.
#
# One file per key, named by a hash of the key, so no key can name a path outside the directory.
# 0600 per file: a cache holds session ids and fragments of authenticated pages. `path` is
# required rather than defaulting to somewhere under /tmp, because a cache that loses its
# contents on an unexpected reboot is the failure a default would cause silently. A relative
# path resolves against this file's directory, so the store lands beside the deployment.
#
# `max_bytes` means what it means on the memory driver, and the count starts from what is
# already on disk -- a store that started at zero would let a restart double the space it uses.
# Expiry is an absolute deadline in the file, so time keeps passing while the process is not
# running. What it deliberately does not do: fsync, compaction, or share a directory between two
# processes. A deployment that needs any of those wants Redis.
# [kv.sessions-file]
# driver = "file"
# path = "var/kv/sessions"
# max_bytes = 67108864           # 64 MiB; the default
# [kv.shared]
# driver = "redis"
# url = "redis://127.0.0.1:6379"
# pool_size = 16                  # one per worker is the natural size; a call blocks the worker that asked

# ---------------------------------------------------------------------------
# Resource locks. Absent means no lock plane, and then a worker calling
# `lock.*` is refused -- the same rule every other service follows.
#
# **Read this before using a lock for anything that matters.** A lock here is
# for coordinating *work*: collapsing a cache miss, keeping two workers from
# rendering the same PDF twice, making a retry cheap. It is NOT a correctness
# primitive. A lock has a lease and no fencing token, so a worker that stalls
# past its lease -- a pause, a swap storm, a debugger -- still believes it holds
# the lock while the server has given it to somebody else, and two processes
# are then inside the section the lock was meant to guard. No server-side care
# fixes that, because the late writer is late precisely because it was not
# running. Where a real invariant is at stake, use the storage's own
# conditional write: a unique index, a compare-and-swap, `SET NX`.
#
# `driver = "memory"` keeps the locks in this process, so they coordinate this
# server's workers and nothing else. That is the common deployment and it needs
# nothing installed. Two things about the API that are easy to get wrong:
#
#   * `ttl` of 0 means **held until released**, not "expires immediately".
#   * `update_lease` **replaces** what is left of the lease; it does not add to
#     it. A caller reading it as "another N seconds" can be released early.
# ---------------------------------------------------------------------------
# [lock]
# driver = "memory"

# Redis, so locks are shared between processes and survive a restart of this
# one. Needs a build with the `redis` feature, like the KV driver above, and
# takes the same URL and pool settings for the same reasons.
#
# Holders live in one hash per resource at `volucer:lock:<resource>`, so
# `HGETALL volucer:lock:pdf:create` in redis-cli shows exactly who is inside and
# until when. That prefix is also what to search for when clearing a wedged lock
# by hand — after `release_all` has been tried, which is the supported way.
#
# `read_timeout_ms` is the deadline on one command. It is the setting that
# turns a Redis that stopped answering into a lock whose state is reported as
# *unknown* rather than into a worker that hangs holding a slot; the caller is
# then told to resolve it by asking, which is the only correct answer and the
# one this server will not invent.
#
# A resource is shared between deployments, so two applications pointing at one
# Redis must not both use a resource name like "cache". Namespace it the way you
# would a cache key.
# [lock]
# driver = "redis"
# url = "redis://127.0.0.1:6379"
# pool_size = 16                  # one per worker is the natural size
# read_timeout_ms = 5000          # 5s; the deadline on one lock command

# Grant a backend access to one of them by name. A bare "kv" is refused, because
# a deployment that adds a second storage later would find the first worker's
# calls quietly going somewhere else. `"lock"` is the whole name -- a lock is
# named by its *resource*, so there is one lock namespace and no name to write.
# [backends.ops]
# kind = "worker"
# command = "php bin/ops-worker.php"
# services = ["config", "workers", "kv.sessions", "lock"]

# ---------------------------------------------------------------------------
# Queues. Absent means no queues, and then a worker calling `jobs.*` is refused.
#
# A job is a task name, an opaque payload and string headers -- the payload is
# never parsed here, exactly as a KV value is never parsed here, so an
# application's serialization and its encryption are its own business.
#
# `pipelines` are the queues; `consume` names the ones THIS server polls. A
# pipeline not in `consume` is producer-only, which is what makes one
# configuration file work for both a web node that pushes mail and a worker node
# that sends it:
#
#     web node:     consume = []              (pushes, never polls)
#     worker node:  consume = ["emails"]      (polls, and can also push)
#
# `driver = "memory"` keeps jobs in this process, and **a restart loses
# everything** -- including jobs that were handed to a consumer and not yet
# acknowledged. It is for work that can be regenerated. A queue that has to
# survive a restart needs a driver with a server behind it, which is `redis`:
#
# [jobs.pipelines.emails]
# driver = "redis"
# url = "redis://127.0.0.1:6379"
# pool_size = 16                     # connections, round-robin
# read_timeout_ms = 5000
#
# A Redis pipeline and a Redis KV storage do **not** share a connection pool,
# unlike two KV storages, which do. Two storages on one server share a namespace
# and pooling them is free; two pipelines are two independent queues whose only
# relationship is the host, and one pipeline's slow command holding a connection
# another pipeline's reserve needed is head-of-line blocking across queues that
# have nothing to do with each other.
#
# One limit is the driver's rather than the queue's: a job's payload must be
# valid UTF-8, because a Redis hash field is a string. A push carrying anything
# else is refused by name at the push rather than mangled at the reserve -- a
# queue that silently corrupted an application's bytes would be one that hands a
# consumer work it cannot possibly interpret.
#
# jobs.pool configures the consumers. The command is a *consumer*, which is the
# consumer example in the PHP SDK rather than a request worker: it boots once and
# keeps whatever it booted -- a connection pool, a container, a warm cache --
# across every job it handles, where a request worker resets per-request state
# between requests. The two are told apart by the frame the work arrives in, so
# pointing this at the wrong one is refused by name rather than served wrongly.
#
# `job_lease_seconds` is the one setting that must be longer than a job takes: a
# lease that runs out while the work is still running means a second consumer
# picks the job up and it happens twice. There is no way to detect that from
# here, which is why it is a number an operator sets rather than one the server
# guesses.
#
# The three keys a consumer inherits from a backend -- `checksum`, `transport`,
# `env` -- are here because a consumer is a process: the transport is the one
# that matters, since its default is a socket on Windows and a pipe elsewhere.
# ---------------------------------------------------------------------------
# [jobs]
# consume = ["emails"]
#
# [jobs.pipelines.emails]
# driver = "memory"
#
# [jobs.pipelines.reports]
# driver = "memory"                  # configured, pushed to, never polled here
#
# [jobs.pool]
# command = "php bin/consumer.php"
# workers = 4                        # 0 means one per logical CPU
# max_jobs = 0                       # recycle a consumer after this many *jobs*; 0 means never
# memory_limit_mb = 128
# job_lease_seconds = 300            # 5 minutes; must exceed the slowest job
# prefetch = 1                       # one job at a time, which is what one consumer can do
# checksum = "required"              # "optional" lets a consumer skip the per-frame crc32c
# transport = "pipe"                 # or "socket"; the default follows the platform
# env = { QUEUE_DATABASE = "jobs" }  # a consumer may talk to a different database
# ---------------------------------------------------------------------------
# Services for an application that is not a worker.
#
# A worker reaches `kv`, `lock` and `jobs` over the channel that carries its
# requests: CALL and RETURN are two more frame types the server already owns. A
# FastCGI application has no such channel -- it exists for the length of one
# request and can only answer what it was handed -- so the call plane gets a
# socket it dials instead. Same frames, same codec, and deliberately **no
# handshake**: a CGI process would pay for one on every request, so the token
# travels with each call.
#
# The grant is the *same* `services` list a worker names, which is the point: a
# deployment cannot grant a cache to its workers and forget the same cache for
# the same application's other half. Volucer writes the address and the token
# into every request a granted backend serves, and writes neither for a backend
# that granted nothing -- so an unprivileged application is not told where the
# socket is and cannot even make an attempt that would be refused.
#
# ```toml
# [backends.fpm]
# kind = "external"
# socket = "unix:/run/php/php-fpm.sock"
# services = ["kv.cache"]              # the grant
#
# [kv.cache]
# driver = "memory"
#
# [rpc]
# listen = "unix:/run/volucer/rpc.sock"
# ```
#
# `[rpc]` alone is not enough, and the grant alone is not either: a listener with
# nothing granted is a socket that refuses every call, and a grant with no
# listener is an application told nothing. Both halves are refused by name at
# startup rather than left as a key that looks active and cannot work.
#
# A wildcard `listen` is refused. Every call on this socket mutates something --
# kv.set, lock.release, jobs.push -- and the token identifies a backend *within
# one host*; it is not a defence against another host. Use a unix socket, or
# loopback.
#
# An `upstream` origin that grants services receives the same two values as the
# headers `X-Volucer-Rpc` and `X-Volucer-Rpc-Token`, because it has no CGI
# environment to receive a parameter in. Any header a client sends under those
# names is discarded before the injection, so an origin can trust them.
# ---------------------------------------------------------------------------
# [rpc]
# listen = "unix:/run/volucer/rpc.sock"
# max_connections = 0                # absent means uncapped; 0 is refused
# idle_timeout_seconds = 300         # a connection is closed this long after its last call
# call_timeout_seconds = 10          # per call; shorter than PHP's own max_execution_time
